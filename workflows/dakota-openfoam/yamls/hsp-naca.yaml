# Dakota-driven OpenFOAM airfoil shape optimization, assembled from two
# standalone workflows: workflows/dakota (the optimizer step: Dakota's MOGA
# proposes batches of NACA 4-digit designs and decides when to stop) and
# workflows/openfoam-naca (the evaluator: one OpenFOAM case per design). Each
# iteration of the loop below runs iteration-naca.yaml, which calls the first as
# its `optimize` job and the second once per proposed design as its `workers`
# matrix; the loop mechanics (retry-as-loop, guarded static matrix, state files,
# failure semantics) come from tutorials/optimization. Before the loop starts,
# preprocessing calls workflows/design-explorer over the study directory, which
# serves it as the pw endpoint design-explorer-<run slug> from the first
# generation on: the objective space with the Pareto front as of any generation
# and the convergence per generation, every design as a line of parallel
# coordinates over the generation, the variables and the coefficients, and each
# design's values and, with postprocessing.generate_images (every case renders
# its fields with ParaView), its images. It keeps serving after the run
# completes until `pw endpoints delete` removes it.
#
# The HSP (activate.hpc.mil) variant of general-naca.yaml: the same loop over
# iteration-naca-hsp.yaml, which calls the hsp variants of the two workflows, with
# the HSP form (SLURM account, QoS and node type for on-prem `existing` resources,
# the PBS account, the DSRC hint). DSRC OpenFOAM modules only set foamDotFile, so
# the OpenFOAM commands under Software Environment are the module load plus
# `source $foamDotFile`; not every HPCMP login node reaches the internet for the
# conda-forge installs (Nautilus does, and has no Dakota module).
permissions:
  - '*'

# Saved inputs, offered under "Load saved inputs" on the Execute page. The form
# defaults to mesh_scale 2, the floor at which 16 ranks are all used (login node,
# 1 core: about 1 min per case); this configuration is the converged-mesh study:
# every generation's 8 cases as SLURM jobs of 4 ranks, ~1.5 min each on 4-core
# nodes, ~25 min in all on gcpsmall. It pins no resource: pick the cluster in the form.
configurations:
  mesh3_slurm_4ranks:
    inputs:
      cluster:
        scheduler: true
        cores_per_case: 4
        slurm:
          is_enabled: true
          time: '01:00:00'
      optimizer:
        max_iterations: 10
        batch_size: 8
        stall_generations: 3
        mesh_scale: 3
        iteration_timeout: 2d
  # the OpenFOAM environment of Nautilus (Navy DSRC): its openfoam module loads
  # the compilers and OpenMPI 5 and only points at OpenFOAM through foamDotFile,
  # asking for the source; Dakota stays on the conda-forge install (no module).
  # mesh_scale 4 is the converged mesh (86k cells), about a minute per case on
  # 16 ranks there
  nautilus_modules:
    inputs:
      optimizer:
        mesh_scale: 4
      software:
        openfoam_load: |
          module load openfoam/Intel/v2512
          source $foamDotFile

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      # this workflow has no app of its own: the optimizer, the evaluator and
      # Design Explorer check out theirs inside their subworkflows. Checked out
      # here: the installers, for the environment check below
      - name: Checkout the Installers
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/dakota/app
            - workflows/openfoam-naca/app
            - tools/utils
      - name: Validate Inputs and Initialize State
        run: |
          set -e
          batch="${{ inputs.optimizer.batch_size }}"
          if ! [[ "${batch}" =~ ^[0-9]+$ ]] || [ "${batch}" -lt 1 ]; then
            echo "::error::batch_size must be a positive integer, got '${batch}'"
            exit 1
          fi
          cores="${{ inputs.cluster.cores_per_case }}"
          if ! [[ "${cores}" =~ ^[0-9]+$ ]] || [ "${cores}" -lt 1 ]; then
            echo "::error::cores_per_case must be a positive integer, got '${cores}'"
            exit 1
          fi
          # 5400 x mesh_scale^2 cells is the C-grid of naca_blockmesh.py; the solver
          # caps the ranks at one per 1000 cells, so say here, once, what a request
          # above that buys (16 ranks on the base mesh diverged where 4 converged)
          ms="${{ inputs.optimizer.mesh_scale }}"
          if [[ "${ms}" =~ ^[0-9]+$ ]] && [ $(( 5400 * ms * ms / cores )) -lt 1000 ]; then
            cells=$(( 5400 * ms * ms ))
            echo "::warning::${cores} cores per case at mesh_scale ${ms} (${cells} cells) leave $(( cells / cores )) cells per rank: each case will run on $(( cells / 1000 > 0 ? cells / 1000 : 1 )) rank(s) and the rest of its allocation idles. Raise mesh_scale (16 ranks need 2 or more) or lower Cores per case."
          fi
          mkdir -p state
          echo "STATE_DIR=${PWD}/state" | tee -a $OUTPUTS
      # the check every worker and the optimizer step make, made once here, before
      # the server starts and before a generation is spent: environment commands
      # that do not deliver the tools (a site module that only sets a variable, a
      # typo) fail the run with the tools' own output. Left to the workers, the
      # loop re-proposes the generation once and ends FAILED with nothing but "no
      # case ran" at the top level (Nautilus, 2026-10-05). With no commands given,
      # the conda-forge installs happen here once, not under batch_size workers.
      - name: Check the Software Environments
        run: |
          set -e
          required="blockMesh potentialFoam simpleFoam"
          if [ "${{ inputs.cluster.cores_per_case }}" -gt 1 ]; then
            required="${required} decomposePar reconstructPar mpirun"
          fi
          bash tools/utils/prepare-env.sh openfoam "${PWD}/openfoam-env.sh" \
            workflows/openfoam-naca/app/install-openfoam.sh ${required} << 'PW_LOAD_EOF'
          ${{ inputs.software.openfoam_load }}
          PW_LOAD_EOF
          bash tools/utils/prepare-env.sh dakota "${PWD}/dakota-env.sh" \
            workflows/dakota/app/install-dakota.sh dakota << 'PW_LOAD_EOF'
          ${{ inputs.software.dakota_load }}
          PW_LOAD_EOF
          if [ "${{ inputs.postprocessing.generate_images }}" = "true" ]; then
            bash tools/utils/prepare-env.sh paraview "${PWD}/paraview-env.sh" \
              workflows/openfoam-naca/app/install-paraview.sh pvpython << 'PW_LOAD_EOF'
          ${{ inputs.software.paraview_load }}
          PW_LOAD_EOF
          fi
      # the page: Design Explorer over the study directory, served by its own
      # workflow, which reads state/iter_<N>/case_<j>/ directly (a case shows as
      # soon as it solved) with the optimizer's problem.json and state.json (the
      # objectives, the bounds, the hypervolume), waits until its endpoint
      # answers and removes a server that never did. Preprocessing only
      # completes once the page is served, so a server that cannot start fails
      # the run before any case is spent
      - name: Design Explorer (Serve the Study)
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/design-explorer/yamls/general.yaml
          resource: ${{ inputs.resource }}
          study:
            cases_dir: ${{ needs.preprocessing.outputs.STATE_DIR }}
            title: NACA airfoil optimization

  optimization_loop:
    needs: [preprocessing]
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      # retry-as-loop: iteration-naca.yaml exits 1 while Dakota wants another
      # generation, and each retry attempt re-invokes it fresh. max-retries is the
      # loop budget: max_iterations proposal cycles + the final converging call.
      # Attempt != iteration — a crashed attempt re-runs the same iteration off the
      # state files and consumes budget. Only the LAST attempt's logs surface here;
      # per-iteration history lives under state/ and on the Design Explorer page.
      - name: Iterate
        retry:
          max-retries: ${{ inputs.optimizer.max_iterations }}
          interval: 10s
          # retry.timeout defaults to 30s (docs: building-workflows/yaml-fields)
          # and cancels the whole attempt — every job of the iteration
          # subworkflow, mid-simulation — when it expires. One generation
          # (propose + node boot + queue + solve + decide) must fit in it.
          timeout: ${{ inputs.optimizer.iteration_timeout }}
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/dakota-openfoam/yamls/iteration-naca-hsp.yaml
          # the retry counter (0 on the first attempt), so the iteration can say
          # which attempt it is; the true iteration is the generation in state/
          attempt: ${{ env.PW_WORKFLOW_STEP_CURRENT_RETRY }}
          resource: ${{ inputs.resource }}
          scheduler: ${{ inputs.cluster.scheduler }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            account: ${{ inputs.cluster.slurm.account }}
            partition: ${{ inputs.cluster.slurm.partition }}
            qos: ${{ inputs.cluster.slurm.qos }}
            node_type: ${{ inputs.cluster.slurm.node_type }}
            time: ${{ inputs.cluster.slurm.time }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            account: ${{ inputs.cluster.pbs.account }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
          cores_per_case: ${{ inputs.cluster.cores_per_case }}
          batch_size: ${{ inputs.optimizer.batch_size }}
          max_iterations: ${{ inputs.optimizer.max_iterations }}
          stall_generations: ${{ inputs.optimizer.stall_generations }}
          mesh_scale: ${{ inputs.optimizer.mesh_scale }}
          angle_of_attack: ${{ inputs.problem.angle_of_attack }}
          variables: ${{ inputs.problem.variables }}
          objectives: ${{ inputs.problem.objectives }}
          seed: ${{ inputs.problem.seed }}
          openfoam_load: ${{ inputs.software.openfoam_load }}
          dakota_load: ${{ inputs.software.dakota_load }}
          generate_images: ${{ inputs.postprocessing.generate_images }}
          paraview_load: ${{ inputs.software.paraview_load }}
          state_dir: ${{ needs.preprocessing.outputs.STATE_DIR }}
      # if: always — the run's verdict comes from the state files, not from how the
      # Iterate step ended: CONVERGED is the only success, whether the loop stopped
      # by decision (Iterate succeeded) or by exhausting its retries (Iterate failed).
      - name: Report
        if: ${{ always }}
        run: |
          state="${{ needs.preprocessing.outputs.STATE_DIR }}"
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          url=$(pw endpoints list 2>/dev/null | awk -F'\t' -v name="design-explorer-${PW_RUN_SLUG}" '$1 == name {print $3}')
          if [ -n "${url}" ]; then
            echo "::notice::Design Explorer keeps serving the study at ${url} (the Pareto front as of any generation, every design and its values$( [ "${{ inputs.postprocessing.generate_images }}" = "true" ] && echo " and images")); remove it with: pw endpoints delete design-explorer-${PW_RUN_SLUG}"
          else
            echo "::warning::the endpoint design-explorer-${PW_RUN_SLUG} is no longer listed; the front is still in ${state}/pareto.csv and ${state}/pareto.svg"
          fi
          status=$(cat "${state}/status" 2>/dev/null || echo MISSING)
          case "${status}" in
            CONVERGED)
              n=$(($(wc -l < "${state}/pareto.csv") - 1))
              echo "::notice::optimization converged: ${n} non-dominated designs in ${state}/pareto.csv, plotted in ${state}/pareto.svg; every evaluation in ${state}/evaluations.csv"
              head -15 "${state}/pareto.csv"
              ;;
            FAILED)
              echo "::error::the optimizer declared FAILED: no case of a generation ran twice in a row, every case failed before any design succeeded or for three generations running, or Dakota exited without proposing or converging. Check the last attempt's worker logs, ${state}/iter_*/case_*/{run.*.out,case/log.*} and ${state}/dakota/dakota.log"
              exit 1
              ;;
            CONTINUE)
              echo "::error::loop budget exhausted before convergence: all retries of the Iterate step were used while the optimizer still wanted to continue. Raise max_iterations (crashed attempts also consume budget) or loosen the convergence knobs."
              exit 1
              ;;
            *)
              echo "::error::no ${state}/status file: the first iteration never reached its optimize step. Read the Iterate attempt logs."
              exit 1
              ;;
          esac

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Compute resource
        include-workspace: false
        tooltip: Resource where Dakota, Design Explorer and all OpenFOAM cases run
      cluster:
        type: group
        label: Compute Cluster Settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Schedule Cases?
            hidden: ${{ inputs.resource.schedulerType == '' }}
            ignore: ${{ .hidden }}
            tooltip: |
              Yes → Each OpenFOAM case is submitted to the scheduler using sbatch, qsub, etc
              No  → Cases run on the controller or login node instead
          cores_per_case:
            type: number
            label: Cores per case
            default: 1
            min: 1
            max: 64
            tooltip: |
              MPI ranks per OpenFOAM case. 1 runs the solvers serially; more
              decomposes the mesh into N strips and runs potentialFoam and
              simpleFoam under mpirun. Only pays off from mesh_scale 3-4 (2-4 ranks): at the
              default mesh a decomposed case is slower than a serial one. The solver
              caps the ranks at one per 1000 cells (5400 x mesh_scale^2 cells per
              case, so 16 ranks need mesh_scale 2 or more): 16 ranks on the base
              mesh diverged where 4 converged. Scheduled
              cases request --nodes=1 --ntasks=N (PBS: select=1:ncpus=N:mpiprocs=N),
              so N must fit one node; on the login node, batch_size x N ranks run
              at once.
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              account:
                label: SLURM account
                type: slurm-accounts
                resource: ${{ inputs.resource }}
                tooltip: '--account=value slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider }}
                hidden: ${{ .ignore }}
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.resource }}
                tooltip: Select a partition from the drop down menu.
              qos:
                label: Quality of Service [QoS]
                type: slurm-qos
                resource: ${{ inputs.resource }}
                tooltip: '--qos=value slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider }}
                hidden: ${{ .ignore }}
              node_type:
                label: Node Type
                type: dropdown
                optional: true
                default: ''
                option-key: ${{ inputs.resource.ip }}
                tooltip: '--constraint=<value> slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider || (inputs.resource.ip != 'blueback.navydsrc.hpc.mil' && inputs.resource.ip != 'narwhal.navydsrc.hpc.mil' && inputs.resource.ip != 'nautilus.navydsrc.hpc.mil' && inputs.resource.ip != 'raider.afrl.hpc.mil' && inputs.resource.ip != 'crux.mhpcc.hpc.mil') }}
                hidden: ${{ .ignore }}
                options:
                  blueback.navydsrc.hpc.mil:
                    - standard
                    - bigmem
                    - mla
                    - viz
                    - transfer
                  narwhal.navydsrc.hpc.mil:
                    - standard
                    - bigmem
                    - mla
                    - smla
                    - dmla
                    - viz
                    - transfer
                  nautilus.navydsrc.hpc.mil:
                    - standard
                    - highclock
                    - bigmem
                    - mla
                    - viz
                    - transfer
                  raider.afrl.hpc.mil:
                    - standard
                    - highclock
                    - bigmem
                    - mla
                    - viz
                    - transfer
                  crux.mhpcc.hpc.mil:
                    - AMD
                    - Intel
              time:
                label: Walltime per case
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for each case (format: D-HH:MM:SS or HH:MM:SS, e.g. 7-00:00:00 or 01:00:00)'
              scheduler_directives:
                type: editor
                optional: true
                default: |
                  ##SBATCH --constraint=mla # uncomment for Navy and AFRL DSRC systems
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
                  The workflow already sets --nodes=1 and --ntasks from Cores per case;
                  a directive here repeating one of them takes precedence.
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              account:
                label: Account
                type: string
                tooltip: PBS account for job submission (-A)
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                default: |
                  # Parameters that apply to all sites
                  #PBS -l walltime=01:00:00
                  #PBS -V
                  #PBS -q standard
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1
                  The workflow already sets -l select=1:ncpus=N:mpiprocs=N from Cores per case;
                  a directive here repeating it takes precedence.
      optimizer:
        type: group
        label: Optimizer Settings
        items:
          max_iterations:
            type: number
            label: Maximum iterations
            default: 10
            min: 1
            max: 50
            tooltip: |
              Generation budget: the loop stops with the front found so far after
              this many evaluated generations, even if Dakota wants to continue.
              Also the loop's retry budget, so a crashed-and-retried iteration
              consumes one.
          batch_size:
            type: number
            label: Cases per iteration
            default: 4
            min: 1
            max: 256
            tooltip: |
              OpenFOAM cases evaluated in parallel each iteration (Dakota MOGA's
              population size). Sizes the workers matrix of iteration-naca.yaml:
              one worker slot per case, expanded at submission. Dakota may
              propose fewer new points in a generation; surplus worker slots are
              skipped for free.
          stall_generations:
            type: number
            label: Stagnation window
            default: 3
            min: 1
            max: 20
            tooltip: |
              Declare convergence when the Pareto front's normalized hypervolume
              improves by less than 0.001 over this many consecutive generations.
              Dakota's own MOGA convergence criteria also end the loop.
          mesh_scale:
            type: number
            label: Mesh resolution multiplier
            default: 2
            min: 1
            max: 6
            tooltip: |
              The cost dial: multiplies every cell count of the C-grid around the
              airfoil, and the solver's iteration budget scales with it, so cost
              grows roughly with the cube: ~10 s per case at 1, ~1 min at 2,
              ~10 min at 4, ~35 min at 6 (one core). The mesh is essentially
              converged by 3-4; the openfoam-naca README has the measured accuracy table.
          iteration_timeout:
            type: string
            label: Time budget per iteration
            default: 2d
            tooltip: |
              Maximum wall time for one generation: propose + evaluate every case
              (including scheduler queue and node boot) + decide. Units like 30s,
              10m, 12h, 2d. The generous default means it only trips on a genuinely
              stuck iteration, which is then canceled and retried (consuming
              budget); tighten it if you want faster failure detection.
      problem:
        type: group
        label: Design Problem
        collapsed: true
        items:
          angle_of_attack:
            type: number
            label: Angle of attack (degrees)
            default: 5
            min: -5
            max: 12
            tooltip: Incidence every case is solved at.
          variables:
            type: editor
            label: Design variables and bounds
            default: |
              max_camber       0.0   0.06
              camber_position  0.3   0.6
              thickness        0.08  0.18
            tooltip: |
              One line per NACA 4-digit parameter: <name> <lower> <upper>. Keep
              the three names (the OpenFOAM case reads them); narrow the bounds
              to focus the search. The full box is where the mesh generator was
              validated.
          objectives:
            type: string
            label: Objectives
            hidden: true
            default: drag_coefficient neg_lift_coefficient
          seed:
            type: number
            label: Dakota seed
            default: 4242
            min: 1
            tooltip: Fixed for the run (Dakota's restart replay requires a deterministic method); change it to get a different search.
      postprocessing:
        type: group
        label: Postprocessing
        items:
          generate_images:
            type: boolean
            label: Generate images?
            default: false
            tooltip: |
              Yes → every OpenFOAM case renders its fields with ParaView (pressure,
              velocity, streamlines, eddy viscosity, wake, mesh), and Design
              Explorer (design-explorer-<run slug>) shows them for every design:
              in its gallery, its case panel and on hover. ParaView comes from
              the commands in Software Environment or, left empty, from the
              official binaries the workflow downloads once (no sudo, ~830 MB);
              rendering adds about 5 s per case.
              No → Design Explorer without images.
      software:
        type: group
        label: Software Environment
        collapsed: true
        items:
          openfoam_load:
            type: editor
            label: OpenFOAM environment commands
            optional: true
            tooltip: |
              Shell commands that put blockMesh, potentialFoam and simpleFoam (and
              decomposePar, reconstructPar plus mpirun when Cores per case > 1) on
              PATH, one per line, e.g. `module load openfoam/2412` or `source
              /opt/openfoam2412/etc/bashrc`. DSRC openfoam modules only set
              foamDotFile: give `module load openfoam/Intel/v2512` and `source
              $foamDotFile` on two lines (Nautilus). Left empty, the workflow
              installs OpenFOAM v2412 from conda-forge (no sudo, ~5 min once) under
              ${service_parent_install_dir:-$HOME/pw/software}/openfoam-naca, which
              only works where the login node reaches the internet (Nautilus does;
              not every HPCMP system does).
              Every case sources these commands; `export MPIRUN="srun --mpi=pmix"`
              here replaces the default launcher `mpirun --bind-to none -np N`.
          dakota_load:
            type: editor
            label: Dakota environment commands
            optional: true
            tooltip: |
              Shell commands that put `dakota` on PATH, e.g. `module load dakota`.
              Left empty, the workflow installs Dakota 6.16 from conda-forge under
              ${service_parent_install_dir:-$HOME/pw/software}/dakota, which only
              works where the login node reaches the internet (Nautilus does, and
              has no Dakota module; not every HPCMP system does).
          paraview_load:
            type: editor
            label: ParaView environment commands
            optional: true
            hidden: ${{ inputs.postprocessing.generate_images == false }}
            ignore: ${{ .hidden }}
            tooltip: |
              Shell commands that put pvpython on PATH, one per line, e.g.
              `module load paraview/5.13`. Leave empty to download the official
              ParaView 6.1.1 Linux binaries (x86_64, no sudo, ~830 MB once, 2.7 GB
              on disk) under
              ${service_parent_install_dir:-$HOME/pw/software}/openfoam-naca/paraview;
              they render without a display. Needs ParaView 5.10 or newer.
