# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

jobs:
  preprocessing:
      ssh:
        remoteHost: ${{ inputs.cluster.resource.ip }}
      steps:
        - name: Checkout
          uses: parallelworks/checkout
          with:
            repo: https://github.com/parallelworks/workflows.git
            branch: canary
            sparse_checkout:
              - workflows/openvscode/app
        - name: Create Inputs
          run: |
            set -x
            # Write PW variables
            env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
            # Encase values between quotes
            sed -i 's/=\(.*\)/="\1"/' inputs.sh
            # Write input form variables and ensure the pw agent is in the PATH
            cat <<'EOF' >> inputs.sh
            PATH=$HOME/pw:$PATH
            service_download_url="${{ inputs.service.download_url }}"
            service_password="${{ inputs.service.password }}"
            service_directory="${{ inputs.service.directory }}"
            service_subdomain="${{ inputs.service.subdomain }}"
            resource_name="${{ inputs.cluster.resource.name }}"
            resource_namespace="${{ inputs.cluster.resource.namespace }}"
            pw_endpoints_args="--name openvscode-${PW_RUN_SLUG} --slug ?folder=${{ inputs.service.directory }}"
            EOF
            # Remove empty variables
            sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
            sed -i '/=""/d' inputs.sh # remove var=""
            # Add export= to all lines
            sed -i 's/^/export /' inputs.sh
        - name: Controller Preprocessing
          run: |
            set -x
            # This script prepares the target host and always runs in the controller node
            cp inputs.sh controller-${PW_JOB_ID}.sh
            cat workflows/openvscode/app/controller.sh >> controller-${PW_JOB_ID}.sh
            bash controller-${PW_JOB_ID}.sh
        - name: Create Service Script
          run: |
            rm -f HOSTNAME SESSION_PORT job.ended job.started
            # This script starts the service
            cp inputs.sh start-service-${PW_JOB_ID}.sh

            # Write code common to all services
            cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

            cleanup() {
                trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
                echo "::notice::Cleaning up..."
                if [ -f cancel.sh ]; then
                    mv cancel.sh cancel.sh.submitted
                    echo "echo Cleanup script was already executed" > cancel.sh
                    bash cancel.sh.submitted
                fi
                kill -- -$$
            }

            trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

            echo "::notice::Starting service"
            EOF
            cat workflows/openvscode/app/start-template.sh >> ./start-service-${PW_JOB_ID}.sh
            echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
            echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1


  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          endpoint_name="openvscode-${PW_RUN_SLUG}"
          echo "::notice::Waiting for endpoint ${endpoint_name} to come online"
          until pw endpoints list | grep -qw "${endpoint_name}"; do
            echo "$(date) Endpoint ${endpoint_name} not found yet; retrying in 10 seconds"
            sleep 10
          done
          echo "::notice::Endpoint ${endpoint_name} is online"
          touch ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          sleep 2
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner
      - name: Check endpoint health
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          endpoint_name="openvscode-${PW_RUN_SLUG}"
          url=$(pw endpoints list | awk -F'\t' -v name="${endpoint_name}" '$1 == name {print $3}')
          if [ -z "${url}" ]; then
            echo "::error title=Error::Endpoint ${endpoint_name} is no longer listed"
            exit 1
          fi
          probe_url="${url}"
          # Anonymous requests never get past the platform's login redirect (307),
          # so the probe carries the run's key: the answer is then the service's own,
          # and a tunnel with nothing listening behind it answers 503.
          if [ -z "${PW_API_KEY}" ]; then
            echo "::error title=Error::PW_API_KEY is not set; cannot probe ${probe_url%%\?*}"
            exit 1
          fi
          echo "::notice::Checking that ${probe_url%%\?*} answers"
          started=$(date +%s)
          while :; do
            resp=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 -H "Authorization: Bearer ${PW_API_KEY}" "${probe_url}")
            code="${resp%% *}"
            location="${resp#* }"
            seen="HTTP ${code}${location:+ -> ${location%%\?*}}"
            elapsed=$(( $(date +%s) - started ))
            case "${code}" in
              2*|3*)
                echo "::notice::Endpoint ${endpoint_name} is healthy: ${seen} from ${probe_url%%\?*} after ${elapsed}s"
                exit 0
                ;;
            esac
            if [ "${elapsed}" -ge 120 ]; then
              break
            fi
            echo "$(date) ${seen} from ${probe_url%%\?*} after ${elapsed}s; retrying in 5 seconds"
            sleep 5
          done
          echo "::error title=Error::Endpoint ${endpoint_name} is unhealthy (${seen} from ${probe_url%%\?*} after ${elapsed}s); deleting it"
          pw endpoints delete "${endpoint_name}"
          exit 1


'on':
  execute:
    inputs:
      cluster:
        type: group
        label: Compute Cluster Settings
        items:
          resource:
            type: compute-clusters
            label: Service host
            include-workspace: false
            tooltip: Resource to host the service
          scheduler:
            type: boolean
            default: false
            label: Schedule Job?
            hidden: ${{ inputs.cluster.resource.schedulerType == '' }}
            ignore: ${{ .hidden }}
            tooltip: |
              Yes → Job is submitted to the scheduler using sbatch, qsub, etc
              No  → Job is executed in the controller or login node instead
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'slurm'  || inputs.cluster.scheduler == false  }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'slurm'  || inputs.cluster.scheduler == false  }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.cluster.resource }}
                tooltip: Select a partition from the drop down menu.
              time:
                label: Walltime
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                default: 0
                hidden: ${{ inputs.cluster.resource.ip != 'dn-slurm-1.parallel.works' }}
                ignore: ${{ .hidden }}
                tooltip: '--gpus= SLURM directive to set the number of GPUs allocated for the job'
              scheduler_directives:
                type: editor
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1

      service:
        type: group
        label: VS Code Settings
        collapsed: true
        items:
          download_url:
            label: Download URL
            type: string
            default: https://github.com/coder/code-server/releases/download/v4.105.1/code-server-4.105.1-linux-amd64.tar.gz
            tooltip: Downloads or uses the code-server server version specified in the URL
          password:
            label: Password for IDE session
            type: password
            optional: true
            tooltip: Enter password or leave blank for no password
          directory:
            label: Directory to open in VS Code
            type: string
            default: ${HOME}
            tooltip: Directory to open in VS code
          subdomain:
            label: Subdomain of the IDE URL
            type: string
            optional: true
            tooltip: |
              The IDE is served at https://<subdomain>.<sessions domain>/. Reuse the same subdomain
              every run: the browser keeps VS Code's sign-ins (GitHub, Copilot), disabled extensions
              and trusted folders per URL, and a new URL starts from scratch. Default:
              vscode-<namespace>-<cluster>-<user>. Pick another label to run a second IDE on the same cluster.

