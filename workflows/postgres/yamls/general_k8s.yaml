# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'
env:
  PW_API_KEY: ${PW_API_KEY}

jobs:
  preprocessing:
    if: ${{ inputs.resource.type != 'kubernetes' }}
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/postgres/app
      - name: Create Inputs
        run: |
          set -x
          # Write PW environment variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          postgres_image="${{ inputs.service.image }}"
          pgweb_image="${{ inputs.service.pgweb_image }}"
          postgres_user="${{ inputs.service.user }}"
          postgres_db="${{ inputs.service.db }}"
          postgres_port="${{ inputs.service.port }}"
          postgres_data_dir="${{ inputs.service.data_dir }}"
          pw_endpoints_args="--name ${{ inputs.service.name }}-${PW_RUN_SLUG}"
          EOF
          # Remove empty and undefined variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          # Add export to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Write Password Files
        run: |
          # The password goes to mode-600 files the containers read, never to
          # inputs.sh or a command line
          umask 077
          cat > postgres-password <<'PASSWORD_EOF'
          ${{ inputs.service.password }}
          PASSWORD_EOF
          truncate -s -1 postgres-password
          # pgpass format escapes backslashes and colons
          { printf '*:*:*:*:'; sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' postgres-password; echo; } > pgpass
      - name: Controller Preprocessing
        run: |
          set -x
          # This script prepares the target host and always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/postgres/app/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat workflows/postgres/app/start-template.sh >> ./start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  session_runner:
    if: ${{ inputs.resource.type != 'kubernetes' }}
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    if: ${{ inputs.resource.type != 'kubernetes' }}
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: ${{ inputs.service.name }}-${PW_RUN_SLUG}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          # pgweb answers this route with 200 only while it holds a database
          # connection, so the probe covers PostgreSQL too
          path: /api/connection
          budget: 300
      - name: Connection Details
        run: |
          if [ -f postgres-connection.env ]; then
              source postgres-connection.env
              echo "::notice title=PostgreSQL::postgresql://${postgres_user}@${postgres_host}:${postgres_port}/${postgres_db} (from jobs on the cluster)"
              echo "::notice title=From your computer::pw forward -L ${postgres_port}:${postgres_host}:${postgres_port} ${{ inputs.resource.uri }}, then psql -h localhost -p ${postgres_port} -U ${postgres_user} ${postgres_db}"
          fi
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

  auth_k8s:
    if: ${{ inputs.resource.type == 'kubernetes' }}
    steps:
      - name: Authenticate kubectl
        early-cancel: any-job-failed
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          pw kube auth ${{ inputs.resource.name }}
  prepare_k8s_pvc:
    if: ${{ inputs.resource.type == 'kubernetes' }}
    needs:
      - auth_k8s
    steps:
      - name: Creating New PVC YAML
        early-cancel: any-job-failed
        if: ${{ inputs.k8s.volumes.pvc == New }}
        run: |
          if [[ ${{ inputs.k8s.volumes.pvc_persist }} == "true" ]]; then
            pvc_name="${{ inputs.k8s.volumes.pvc_name }}"
          else
            job_number=$(pwd | rev | cut -d "/" -f1 | rev)
            workflow_name=$(pwd | rev | cut -d "/" -f2 | rev)
            pvc_name=$(echo "${PW_USER}${workflow_name}${job_number}" | sed 's|_||g' | sed 's|\.||g' | tr '[:upper:]' '[:lower:]' | tail -c 56)-pvc
          fi
          pvc_storage_class=${{ inputs.k8s.volumes.pvc_storage_class }}
          if [ -z "${pvc_storage_class}" ] || [[ "${pvc_storage_class}" == "undefined" ]]; then
            default_class=$(kubectl get storageclass -n ${{ inputs.k8s.namespace }} | grep '(default)')
            if [ $? -ne 0 ]; then
              echo "WARNING: Could not obtain default storageClass with command:"
              echo "         kubectl get storageclass -n ${{ inputs.k8s.namespace }}"
              echo "         You might need to provide a storage class input"
            elif [ -z "${default_class}" ]; then
              echo "ERROR: No default storage class found. You must specify one explicitly."
              exit 1
            fi
          else
            storageClassName="storageClassName: ${{ inputs.k8s.volumes.pvc_storage_class }}"
          fi
          echo "${pvc_name}" > pvc_name
          cat <<EOF > pvc.yaml
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ${pvc_name}
            namespace: ${{ inputs.k8s.namespace }}
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: ${{ inputs.k8s.volumes.pvc_storage_size }}
            ${storageClassName}
          EOF
          cat pvc.yaml
      - name: Dry Run PVC
        early-cancel: any-job-failed
        if: ${{ inputs.resource.type == 'kubernetes' && inputs.k8s.volumes.pvc == New }}
        run: |
          echo "Performing dry run..."
          kubectl apply -f pvc.yaml --dry-run=client
  prepare_k8s_deployment:
    if: ${{ always }}
    needs:
      - prepare_k8s_pvc
    steps:
      - name: Defining App Name
        early-cancel: any-job-failed
        if: ${{ inputs.resource.type == 'kubernetes' }}
        run: |
          job_number=$(pwd | rev | cut -d "/" -f1 | rev)
          workflow_name=$(pwd | rev | cut -d "/" -f2 | rev)
          app_name=$(echo "${PW_USER}${workflow_name}${job_number}" | sed 's|_||g' | sed 's|\.||g' | tr '[:upper:]' '[:lower:]' | tail -c 56)
          echo "app_name=${app_name}" | tee -a $OUTPUTS | tee -a OUTPUTS
          service_db="${{ inputs.service_k8s.db }}"
          if [ -z "${service_db}" ] || [[ "${service_db}" == "undefined" ]]; then
            service_db="${{ inputs.service_k8s.user }}"
          fi
          for name in "${{ inputs.service_k8s.user }}" "${service_db}"; do
            if ! [[ "${name}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
              echo "::error title=Error::Invalid user or database name '${name}': use letters, digits, '_', '.' and '-'"
              exit 1
            fi
          done
          echo "service_db=${service_db}" | tee -a $OUTPUTS | tee -a OUTPUTS
      - name: Creating Deployment and Service YAML
        early-cancel: any-job-failed
        if: ${{ inputs.resource.type == 'kubernetes' }}
        run: |
          if [[ "${{ inputs.k8s.volumes.pvc }}" == "Existing" ]]; then
            pvc_name=${{ inputs.k8s.volumes.pvc_existing }}
          else
            pvc_name=$(cat pvc_name)
          fi

          # Recreate: a rolling update would start a second server on the same
          # volume before stopping the first. --auth-host makes a new cluster ask
          # for the password on the pod's loopback too, where kubectl port-forward
          # arrives and which the image's initdb leaves trusted. pgweb has no login
          # of its own, so it only listens on the loopback, where the sidecar
          # reaches it; the Service publishes the database alone, inside the cluster.
          cat <<EOF > app.yaml

          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ needs.prepare_k8s_deployment.outputs.app_name }}
            namespace: ${{ inputs.k8s.namespace }}
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: ${{ needs.prepare_k8s_deployment.outputs.app_name }}
            template:
              metadata:
                labels:
                  app: ${{ needs.prepare_k8s_deployment.outputs.app_name }}
              spec:
                containers:
                  - name: postgres
                    image: ${{ inputs.service_k8s.image }}
                    ports:
                      - containerPort: 5432
                    env:
                      - name: PGDATA
                        value: "${{ inputs.k8s.volumes.pvc_mount_path }}/pgdata"
                      - name: POSTGRES_USER
                        value: "${{ inputs.service_k8s.user }}"
                      - name: POSTGRES_DB
                        value: "${{ needs.prepare_k8s_deployment.outputs.service_db }}"
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${{ needs.prepare_k8s_deployment.outputs.app_name }}-postgres
                            key: password
                      - name: POSTGRES_INITDB_ARGS
                        value: "--auth-host=scram-sha-256"
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-h", "127.0.0.1", "-U", "${{ inputs.service_k8s.user }}", "-d", "postgres"]
                      periodSeconds: 2
                      timeoutSeconds: 5
                    resources:
                      requests:
                        memory: "${{ inputs.k8s.resources.requests.memory }}"
                        cpu: "${{ inputs.k8s.resources.requests.cpu }}"
                      limits:
                        memory: "${{ inputs.k8s.resources.limits.memory }}"
                        cpu: "${{ inputs.k8s.resources.limits.cpu }}"
                    volumeMounts:
                      - name: storage
                        mountPath: ${{ inputs.k8s.volumes.pvc_mount_path }}
                      - name: shm
                        mountPath: /dev/shm
                  - name: pgweb
                    image: ${{ inputs.service_k8s.pgweb_image }}
                    command:
                      - /usr/bin/pgweb
                    args:
                      - --bind=127.0.0.1
                      - --listen=8081
                      - --skip-open
                      - --no-ssh
                      - --host=127.0.0.1
                      - --port=5432
                      - --user=${{ inputs.service_k8s.user }}
                      - --db=${{ needs.prepare_k8s_deployment.outputs.service_db }}
                      - --ssl=disable
                      - --passfile=/run/secrets/pgweb/pgpass
                      - --open-retry=300
                      - --open-retry-delay=2
                    resources:
                      requests:
                        memory: "64Mi"
                        cpu: "50m"
                      limits:
                        memory: "256Mi"
                        cpu: "500m"
                    volumeMounts:
                      - name: pgpass
                        mountPath: /run/secrets/pgweb
                        readOnly: true
                  # Sidecar: the pw client dials out and exposes pgweb as an endpoint
                  - name: pw-endpoint
                    image: ghcr.io/parallelworks/pw-cli:v7.79.0
                    args:
                      - endpoints
                      - http
                      - --name
                      - ${{ inputs.service_k8s.name }}-${PW_RUN_SLUG}
                      - --output
                      - text
                      - "8081"
                    env:
                      - name: PW_PLATFORM_HOST
                        value: "${PW_PLATFORM_HOST}"
                      - name: PW_API_KEY
                        valueFrom:
                          secretKeyRef:
                            name: ${{ needs.prepare_k8s_deployment.outputs.app_name }}-pw-api-key
                            key: PW_API_KEY
                    resources:
                      requests:
                        memory: "64Mi"
                        cpu: "50m"
                      limits:
                        memory: "256Mi"
                        cpu: "500m"
                volumes:
                  - name: storage
                    persistentVolumeClaim:
                      claimName: ${pvc_name}
                  - name: pgpass
                    secret:
                      secretName: ${{ needs.prepare_k8s_deployment.outputs.app_name }}-postgres
                      defaultMode: 0444
                      items:
                        - key: pgpass
                          path: pgpass
                  - name: shm
                    emptyDir:
                      medium: Memory
                      sizeLimit: 256Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ needs.prepare_k8s_deployment.outputs.app_name }}
            namespace: ${{ inputs.k8s.namespace }}
          spec:
            selector:
              app: ${{ needs.prepare_k8s_deployment.outputs.app_name }}
            ports:
              - name: postgres
                protocol: TCP
                port: 5432
                targetPort: 5432
          EOF
      - name: Dry Run Deployment
        early-cancel: any-job-failed
        if: ${{ inputs.resource.type == 'kubernetes' }}
        run: |
          echo "Performing dry run..."
          kubectl apply -f app.yaml --dry-run=client
  apply_k8s_deployment:
    if: ${{ inputs.resource.type == 'kubernetes' }}
    needs:
      - prepare_k8s_deployment
    steps:
      - name: Load outputs
        early-cancel: any-job-failed
        run: cat OUTPUTS >> $OUTPUTS
      - name: Apply PVC
        if: ${{ inputs.resource.type == 'kubernetes' && inputs.k8s.volumes.pvc == New }}
        run: kubectl apply -f pvc.yaml
        cleanup: |
          [[ "${DEBUG:-}" == "true" ]] && set -x
          if [[ "${{ inputs.k8s.volumes.pvc_persist }}" == "false" ]]; then
            MAX_ATTEMPTS=5
            ATTEMPT=1
            while true; do
              if kubectl delete -f pvc.yaml; then
                echo "PVC deleted successfully"
                touch pvc.deleted
                break
              elif [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
                echo "Failed to delete PVC after $MAX_ATTEMPTS attempts"
                exit 1
              else
                echo "Attempt $ATTEMPT to delete PVC failed. Retrying in 5 seconds..."
                sleep 5
                ((ATTEMPT++))
              fi
            done
          fi
      - name: Create API Key Secret
        early-cancel: any-job-failed
        run: |
          kubectl create secret generic ${{ needs.apply_k8s_deployment.outputs.app_name }}-pw-api-key \
            --namespace ${{ inputs.k8s.namespace }} \
            --from-literal=PW_API_KEY="${PW_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
        cleanup: |
          kubectl delete secret ${{ needs.apply_k8s_deployment.outputs.app_name }}-pw-api-key \
            --namespace ${{ inputs.k8s.namespace }} --ignore-not-found
      - name: Create Password Secret
        early-cancel: any-job-failed
        run: |
          # From files, so the password never reaches a command line
          umask 077
          cat > postgres-password <<'PASSWORD_EOF'
          ${{ inputs.service_k8s.password }}
          PASSWORD_EOF
          truncate -s -1 postgres-password
          if ! [ -s postgres-password ]; then
            echo "::error title=Error::A password is required"
            exit 1
          fi
          # pgpass format escapes backslashes and colons
          { printf '*:*:*:*:'; sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' postgres-password; echo; } > pgpass
          kubectl create secret generic ${{ needs.apply_k8s_deployment.outputs.app_name }}-postgres \
            --namespace ${{ inputs.k8s.namespace }} \
            --from-file=password=postgres-password \
            --from-file=pgpass=pgpass \
            --dry-run=client -o yaml | kubectl apply -f -
          status=$?
          rm -f postgres-password pgpass
          exit ${status}
        cleanup: |
          kubectl delete secret ${{ needs.apply_k8s_deployment.outputs.app_name }}-postgres \
            --namespace ${{ inputs.k8s.namespace }} --ignore-not-found
      - name: Apply Deployment and Service
        run: kubectl apply -f app.yaml
        cleanup: |
          [[ "${DEBUG:-}" == "true" ]] && set -x
          MAX_ATTEMPTS=5
          ATTEMPT=1
          while true; do
            if kubectl delete -f app.yaml; then
              echo "Resources deleted successfully"
              touch app.deleted
              break
            elif [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "Failed to delete resources after $MAX_ATTEMPTS attempts"
              exit 1
            else
              echo "Attempt $ATTEMPT to delete resources failed. Retrying in 5 seconds..."
              sleep 5
              ((ATTEMPT++))
            fi
          done
      - name: Wait for PostgreSQL to be Ready
        early-cancel: any-job-failed
        env:
          app_name: ${{ needs.apply_k8s_deployment.outputs.app_name }}
          namespace: ${{ inputs.k8s.namespace }}
        run: |
          # pgweb exits on a failed login instead of retrying, so a wrong password
          # keeps the pod from ever being Ready: the login check runs as soon as
          # the database container is ready, before the deployment is waited for
          query='{.items[0].status.containerStatuses[?(@.name=="postgres")].ready}'
          for i in $(seq 1 200); do
            if [ "$(kubectl get pods -l app=${app_name} -n ${namespace} -o jsonpath="${query}" 2>/dev/null)" == "true" ]; then
              pod=$(kubectl get pods -l app=${app_name} -n ${namespace} -o jsonpath='{.items[0].metadata.name}')
              echo "pod=${pod}" | tee -a $OUTPUTS | tee -a OUTPUTS
              exit 0
            fi
            if (( i % 10 == 0 )); then
              kubectl get pods -l app=${app_name} -n ${namespace} -o wide
            fi
            sleep 3
          done
          echo "::error title=Error::PostgreSQL was not ready within 10 minutes"
          kubectl describe pods -l app=${app_name} -n ${namespace} | tail -30
          exit 1
      - name: Check Login and Database
        early-cancel: any-job-failed
        run: |
          # The image applies the user and password only when it initializes an
          # empty volume, so an existing PVC keeps those of the run that created it.
          # The check connects to the pod's own address: a volume initialized
          # without --auth-host trusts the loopback and would accept any password.
          if ! kubectl exec -i -n ${{ inputs.k8s.namespace }} ${{ needs.apply_k8s_deployment.outputs.pod }} -c postgres -- sh -c \
              'PGPASSWORD="$POSTGRES_PASSWORD" exec psql -h "$(hostname -i | cut -d" " -f1)" -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -v db="$POSTGRES_DB" -q' <<'SQL'
          SELECT format('CREATE DATABASE %I', :'db')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db')\gexec
          SQL
          then
            echo "::error title=Error::Cannot log in to PostgreSQL as ${{ inputs.service_k8s.user }} with the password given. The volume keeps the user and password of the run that created it: use those, or a new PVC."
            exit 1
          fi
      - name: Wait for Deployment to be Ready
        early-cancel: any-job-failed
        env:
          app_name: ${{ needs.apply_k8s_deployment.outputs.app_name }}
          namespace: ${{ inputs.k8s.namespace }}
        run: |

          log() {
            while true; do
              echo
              echo; echo "[INFO] $(date) - Checking deployment status for ${app_name} in namespace ${namespace}..."
              kubectl get deployment "${app_name}" -n "${namespace}" -o wide || echo "[WARN] Unable to get deployment"

              echo; echo "[INFO] $(date) - Pods status:"
              kubectl get pods -l app="${app_name}" -n "${namespace}" -o wide || echo "[WARN] Unable to get pods"

              pod_name=$(kubectl get pods -l app="${app_name}" -n "${namespace}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [[ -n "$pod_name" ]]; then
                echo; echo "[INFO] $(date) - Describing pod ${pod_name}..."
                kubectl describe pod "${pod_name}" -n "${namespace}" | grep -A20 "Events"
              fi

              echo "---------------------------------------------"
              sleep 10
            done
          }

          log &
          log_pid=$!
          trap "kill ${log_pid}" EXIT SIGINT SIGTERM
          [[ "${DEBUG:-}" == "true" ]] && set -x
          kubectl wait --for=condition=available --timeout=600s deployment/${app_name} -n ${namespace}
          exit_code=$?
          kubectl get deployment ${app_name} -n ${namespace} -o wide
          kubectl describe deployment ${app_name} -n ${namespace}
          exit ${exit_code}
      - name: Wait for Pod to be Ready
        early-cancel: any-job-failed
        env:
          app_name: ${{ needs.apply_k8s_deployment.outputs.app_name }}
          namespace: ${{ inputs.k8s.namespace }}
        run: |
          echo "Waiting for pod to be ready..."
          kubectl wait --for=condition=Ready pod -l app=${app_name} -n ${namespace} --timeout=600s
          pod=$(kubectl get pods -n ${namespace} -l app=${app_name} --field-selector=status.phase=Running -o jsonpath="{.items[0].metadata.name}")
          echo "pod=$pod" | tee -a $OUTPUTS | tee -a OUTPUTS
          touch pod.running
      - name: Stream Logs
        early-cancel: any-job-failed
        run: kubectl logs -f deployment/${{ needs.apply_k8s_deployment.outputs.app_name }} -n ${{ inputs.k8s.namespace }} --all-containers
  wait_for_endpoint_k8s:
    if: ${{ inputs.resource.type == 'kubernetes' }}
    needs:
      - prepare_k8s_deployment
    steps:
      - name: Wait until the Kubernetes deployment reaches its final stage
        early-cancel: any-job-failed
        run: |
          while true; do
            if [ -f "app.deleted" ]; then
              echo "File app.deleted was detected. Exiting..."
              exit 0
            elif [ -f "pod.running" ]; then
              echo "Pod is ready"
              break
            fi
            sleep 2
          done
      - name: Wait for endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: ${{ inputs.service_k8s.name }}-${PW_RUN_SLUG}
          # pgweb answers this route with 200 only while it holds a database
          # connection, so the probe covers PostgreSQL too
          path: /api/connection
          budget: 300
      - name: Connection Details
        env:
          app_name: ${{ needs.prepare_k8s_deployment.outputs.app_name }}
          service_db: ${{ needs.prepare_k8s_deployment.outputs.service_db }}
          namespace: ${{ inputs.k8s.namespace }}
        run: |
          user="${{ inputs.service_k8s.user }}"
          echo "::notice title=PostgreSQL::postgresql://${user}@${app_name}.${namespace}.svc.cluster.local:5432/${service_db} (from pods in the cluster)"
          echo "::notice title=From your computer::pw kube auth ${{ inputs.resource.name }}, then kubectl port-forward -n ${namespace} service/${app_name} 5432:5432 and psql -h localhost -p 5432 -U ${user} ${service_db}"

'on':
  execute:
    inputs:
      resource:
        type: compute-resources
        label: Service host
        include-workspace: false
        tooltip: Resource to host the service. On a compute cluster Docker must be available on the selected host.
      cluster:
        hidden: ${{ inputs.resource.type == 'kubernetes' || inputs.resource.schedulerType == '' }}
        ignore: ${{ inputs.resource.type == 'kubernetes' || inputs.resource.schedulerType == '' }}
        type: group
        label: Compute cluster settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Submit to the scheduler
            description: Otherwise the job runs on the login node.
          slurm:
            type: group
            label: SLURM directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.resource }}
              time:
                label: Walltime
                description: HH:MM:SS, or D-HH:MM:SS for runs over a day.
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                step: 1
                default: 0
                hidden: ${{ inputs.resource.ip != 'dn-slurm-1.parallel.works' }}
                ignore: ${{ .hidden }}
                tooltip: '--gpus= SLURM directive to set the number of GPUs allocated for the job'
              scheduler_directives:
                type: editor
                label: Scheduler directives
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler directives
                type: editor
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1

      service:
        type: group
        label: PostgreSQL settings
        hidden: ${{ inputs.resource.type == 'kubernetes' }}
        ignore: ${{ inputs.resource.type == 'kubernetes' }}
        items:
          name:
            type: string
            hidden: true
            default: postgres
          user:
            label: User
            type: string
            default: postgres
            tooltip: Superuser created with a new data directory (POSTGRES_USER).
          password:
            label: Password
            description: A data directory keeps the user and password it was created with.
            type: password
            optional: ${{ inputs.resource.type == 'kubernetes' }}
            tooltip: |
              The user's password (POSTGRES_PASSWORD).
          db:
            label: Database
            description: Created if missing; defaults to the user's name.
            type: string
            default: postgres
            optional: true
          port:
            label: Database port
            description: Jobs on the cluster connect to <node>:<port>; from your computer, forward it with pw forward.
            type: number
            default: 5432
            min: 1
            max: 65535
            step: 1
            tooltip: |
              Port PostgreSQL listens on, on the node it runs on.
          data_dir:
            label: Data directory
            description: Reuse it to keep your databases across sessions; only one run at a time can serve it.
            type: string
            default: ${HOME}/postgres
            tooltip: |
              Keeps the database cluster (in pgdata/).
          image:
            label: PostgreSQL image
            description: A data directory only opens with the major version that created it.
            type: string
            default: postgres:18
            tooltip: |
              The official image (https://hub.docker.com/_/postgres) or one built on it, e.g. pgvector/pgvector:pg18 or postgis/postgis:18-3.6. A data directory only opens with the major version that created it.
          pgweb_image:
            type: string
            hidden: true
            default: sosedoff/pgweb:0.17.0

      k8s:
        type: group
        label: Kubernetes settings
        hidden: ${{ inputs.resource.type != 'kubernetes' }}
        ignore: ${{ inputs.resource.type != 'kubernetes' }}
        items:
          namespace:
            label: Namespace
            type: kubernetes-namespaces
            clusterName: ${{ inputs.resource.name }}
            optional: ${{ inputs.resource.type != 'kubernetes' }}
          volumes:
            type: group
            label: Volumes
            collapsed: true
            tooltip: Specify storage settings for Persistent Volume Claims (PVCs), including size, storage class, and mount path. The database cluster is kept on this volume, in pgdata/.
            items:
              pvc:
                label: Persistent volume claim
                type: dropdown
                default: New
                options:
                  - value: Existing
                    label: Select Existing PVC
                  - value: New
                    label: Create New PVC
              pvc_mount_path:
                label: Mount path
                type: string
                default: /mnt
              pvc_existing:
                label: Select PVC name
                type: kubernetes-pvc
                clusterName: ${{ inputs.resource.name }}
                namespace: ${{ inputs.k8s.namespace }}
                hidden: ${{ inputs.k8s.volumes.pvc != Existing }}
                ignore: ${{ .hidden }}
                optional: ${{ .hidden }}
              pvc_storage_size:
                label: Enter PVC size
                type: string
                hidden: ${{ inputs.k8s.volumes.pvc != New }}
                ignore: ${{ .hidden }}
                optional: ${{ .hidden }}
                default: 10Gi
              pvc_storage_class:
                label: Enter PVC storage class
                description: Leave blank for the default storage class of the cluster.
                type: string
                hidden: ${{ inputs.k8s.volumes.pvc != New }}
                ignore: ${{ .hidden }}
                optional: true
              pvc_persist:
                label: Persist PVC after completion
                description: Otherwise the PVC and the databases on it are deleted when the run ends.
                type: boolean
                default: false
                hidden: ${{ inputs.k8s.volumes.pvc != 'New' }}
                ignore: ${{ .hidden }}
                optional: ${{ .hidden }}
              pvc_name:
                label: Enter PVC name
                type: string
                hidden: ${{ inputs.k8s.volumes.pvc_persist == false || inputs.k8s.volumes.pvc != New  }}
                ignore: ${{ .hidden }}
                optional: ${{ .hidden }}
          resources:
            type: group
            label: Resources
            collapsed: true
            tooltip: Configure the CPU and memory allocated to the PostgreSQL container. pgweb and the endpoint sidecar add 50m CPU and 64Mi memory each to the requests.
            items:
              requests:
                type: group
                label: Requests
                items:
                  memory:
                    label: Memory
                    description: For example 512Mi or 1Gi.
                    type: string
                    default: 512Mi
                  cpu:
                    label: CPU
                    description: For example 0.5, 1 or 100m (millicores).
                    type: string
                    default: '1'
              limits:
                type: group
                label: Limits
                items:
                  memory:
                    label: Memory
                    description: For example 1Gi or 2Gi; shared memory up to 256Mi counts against it.
                    type: string
                    default: 1Gi
                  cpu:
                    label: CPU
                    description: For example 1, 2 or 500m.
                    type: string
                    default: '2'
      service_k8s:
        type: group
        label: PostgreSQL settings
        hidden: ${{ inputs.resource.type != 'kubernetes' }}
        ignore: ${{ inputs.resource.type != 'kubernetes' }}
        items:
          name:
            type: string
            hidden: true
            default: postgres
          user:
            label: User
            type: string
            default: postgres
            tooltip: Superuser created with a new volume (POSTGRES_USER).
          password:
            label: Password
            description: A volume keeps the user and password it was created with.
            type: password
            optional: ${{ inputs.resource.type != 'kubernetes' }}
            tooltip: |
              The user's password (POSTGRES_PASSWORD).
          db:
            label: Database
            description: Created if missing; defaults to the user's name.
            type: string
            default: postgres
            optional: true
          image:
            label: PostgreSQL image
            description: A volume only opens with the major version that created it.
            type: string
            default: postgres:18
            tooltip: |
              The official image (https://hub.docker.com/_/postgres) or one built on it, e.g. pgvector/pgvector:pg18 or postgis/postgis:18-3.6. A volume only opens with the major version that created it.
          pgweb_image:
            type: string
            hidden: true
            default: sosedoff/pgweb:0.17.0
