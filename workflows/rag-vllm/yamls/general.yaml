# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
---
# vLLM inference server exposed as a pw endpoint, with an optional RAG
# stack (ChromaDB + indexer + OpenAI-compatible proxy).
#
# SIF images are pulled once from ghcr.io as ORAS artifacts; nodes that cannot
# mount squashfs images get a sandbox directory unpacked from them on demand.
# In RAG mode the checked-out app directory is copied to a short path and
# its start_service.sh launches the stack; the endpoint targets the RAG proxy instead of vLLM directly.
# The run completes once the endpoint registers and the service lives on;
# tear it down with `pw endpoints delete <name>`.

permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/rag-vllm/app
      - name: Create Inputs
        run: |
          set -x
          # Write PW variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          runtype="${{ inputs.runtype }}"
          service_parent_install_dir="${{ inputs.service.parent_install_dir }}"
          container_uri="${{ inputs.service.container_uri }}"
          rag_container_uri="${{ inputs.service.rag_container_uri }}"
          rag_rundir="${{ inputs.service.rundir }}"
          model_source="${{ inputs.model.source }}"
          model_local_path="${{ inputs.model.local_path }}"
          hf_model_id="${{ inputs.model.hf_model_id }}"
          hf_token="${{ inputs.model.hf_token }}"
          model_cache_dir="${{ inputs.model.cache_dir }}"
          chat_template_override="${{ inputs.model.chat_template }}"
          vllm_attention_backend="${{ inputs.vllm.attention_backend }}"
          rag_docsdir="${{ inputs.rag.docsdir }}"
          rag_max_tokens="${{ inputs.rag.max_tokens }}"
          rag_embedding_source="${{ inputs.rag.embedding_model_source }}"
          rag_embedding_id="${{ inputs.rag.embedding_model_id }}"
          rag_embedding_path="${{ inputs.rag.embedding_model_path }}"
          rag_embedding_cache_dir="${{ inputs.rag.embedding_model_cache_dir }}"
          rag_systemprompt="${{ inputs.rag.systemprompt }}"
          pw_endpoints_args="--name ${{ inputs.service.name }}-${PW_RUN_SLUG} --openai"
          EOF
          vllm_args="--tensor-parallel-size ${{ inputs.vllm.num_gpus }} --gpu-memory-utilization ${{ inputs.vllm.gpu_memory }}"
          if [ "${{ inputs.vllm.dtype }}" != "custom" ]; then
            vllm_args="--dtype ${{ inputs.vllm.dtype }} ${vllm_args}"
          fi
          if [ "${{ inputs.vllm.max_model_len }}" != "auto" ]; then
            vllm_args="${vllm_args} --max-model-len ${{ inputs.vllm.max_model_len }}"
          fi
          vllm_args="${vllm_args} ${{ inputs.vllm.extra_args }}"
          echo "vllm_args=\"${vllm_args}\"" >> inputs.sh
          # Remove empty variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          # Add export to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Controller Preprocessing
        early-cancel: any-job-failed
        run: |
          set -x
          if [ ! -s workflows/rag-vllm/app/controller.sh ]; then
              echo "::error title=Error::controller.sh not found in the checkout"
              exit 1
          fi
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/rag-vllm/app/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          if [ ! -s workflows/rag-vllm/app/start-template.sh ]; then
              echo "::error title=Error::start-template.sh not found in the checkout"
              exit 1
          fi
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF

          cat workflows/rag-vllm/app/start-template.sh >> start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  prepare_model:
    if: ${{ inputs.model.source == 'huggingface' }}
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Download Model
        early-cancel: any-job-failed
        run: |
          set -o pipefail
          set -x
          MODEL_ID="${{ inputs.model.hf_model_id }}"
          HF_TOKEN="${{ inputs.model.hf_token }}"
          CACHE_DIR="${{ inputs.model.cache_dir }}"
          if [ -z "${CACHE_DIR}" ] || [ "${CACHE_DIR}" = "undefined" ]; then
              CACHE_DIR=~/pw/models
          fi
          CACHE_DIR="${CACHE_DIR/#\~/$HOME}"
          NAME="${MODEL_ID##*/}"
          # A shared cache (/contrib/pw/models on NOAA) is usually owned by whoever
          # staged it first: a model already there is served read-only by every
          # account, and one that still has to be downloaded goes there only when this
          # account can write it, otherwise into a private cache. start-template.sh
          # looks in both.
          PRIVATE_CACHE_DIR="${HOME}/pw/software/models"

          validate_model() {
              [ -s "$1/config.json" ] || return 1
              local f
              f=$(find "$1" -maxdepth 1 \( -name '*.safetensors' -o -name '*.bin' \) -size +1M 2>/dev/null | head -1)
              [ -n "$f" ]
          }
          usable_dir() { # writable if it exists, creatable if it does not
              if [ -d "$1" ]; then [ -w "$1" ]; else mkdir -p "$1" 2>/dev/null; fi
          }
          # Leaves what this run uses from a shared cache group-writable so any project
          # member can refresh it; best effort, and nothing to do for a private path
          share() {
              case "$1" in "${HOME}"/*) return 0 ;; esac
              chmod -R g+rwX,o+rX "$1" 2>/dev/null
              find "$1" -type d -exec chmod g+s {} + 2>/dev/null
              chmod g+rwx,o+rx "${1%/*}" 2>/dev/null
              chmod g+s "${1%/*}" 2>/dev/null
              return 0
          }

          for d in "${CACHE_DIR}" "${PRIVATE_CACHE_DIR}"; do
              if validate_model "${d}/${NAME}"; then
                  share "${d}/${NAME}"
                  echo "Model already cached at ${d}/${NAME}"
                  exit 0
              fi
          done
          if ! usable_dir "${CACHE_DIR}/${NAME}"; then
              echo "::warning::${CACHE_DIR} is not writable; downloading ${MODEL_ID} into ${PRIVATE_CACHE_DIR}"
              CACHE_DIR="${PRIVATE_CACHE_DIR}"
              if ! usable_dir "${CACHE_DIR}/${NAME}"; then
                  echo "::error title=Error::cannot create ${CACHE_DIR}/${NAME}"
                  exit 1
              fi
          fi
          TARGET_DIR="${CACHE_DIR}/${NAME}"
          # Keep HF working caches off the small $HOME filesystem where possible
          export HF_HOME="${CACHE_DIR}/cache"
          usable_dir "${HF_HOME}" || export HF_HOME="${PRIVATE_CACHE_DIR}/cache"

          VENV_BASE="${{ inputs.service.parent_install_dir }}"
          if [ -z "${VENV_BASE}" ] || [ "${VENV_BASE}" = "undefined" ]; then
              VENV_BASE=${HOME}/pw/software
          fi
          HF_BIN=""
          for d in "${VENV_BASE/#\~/$HOME}/.hfcli" "${HOME}/pw/software/.hfcli"; do
              for b in "${d}/bin/hf" "${d}/bin/huggingface-cli"; do
                  if [ -x "${b}" ]; then
                      HF_BIN="${b}"
                      break 2
                  fi
              done
          done
          if [ -z "${HF_BIN}" ]; then
              VENV="${VENV_BASE/#\~/$HOME}/.hfcli"
              usable_dir "${VENV}" || VENV="${HOME}/pw/software/.hfcli"
              if ! python3 -m venv "${VENV}"; then
                  echo "::error title=Error::python3 -m venv failed; install python3/python3-venv on the cluster"
                  exit 1
              fi
              "${VENV}/bin/pip" install --quiet --upgrade 'huggingface_hub[hf_transfer]'
              share "${VENV}"
              HF_BIN="${VENV}/bin/hf"
              [ -x "${HF_BIN}" ] || HF_BIN="${VENV}/bin/huggingface-cli"
          fi

          if [ -n "${HF_TOKEN}" ] && [ "${HF_TOKEN}" != "undefined" ]; then
              export HF_TOKEN
          fi
          # hf download is incremental: it resumes a partial download in place
          # and only fetches files that are missing or changed
          export HF_HUB_ENABLE_HF_TRANSFER=1
          for attempt in 1 2 3; do
              if "${HF_BIN}" download "${MODEL_ID}" --local-dir "${TARGET_DIR}" \
                  --exclude "original/*" --exclude "metal/*" --exclude "*.bin" \
                  --exclude "*.gguf" --exclude "*.onnx" --exclude "consolidated*.pth"; then
                  break
              fi
              if [ "${attempt}" = 3 ]; then
                  echo "::error title=Error::model download failed after 3 attempts"
                  exit 1
              fi
              # hf_transfer can be flaky on some networks; retry without it
              unset HF_HUB_ENABLE_HF_TRANSFER
              sleep $((attempt * 5))
          done

          # Some models only ship bin weights
          if ! ls "${TARGET_DIR}"/*.safetensors >/dev/null 2>&1; then
              "${HF_BIN}" download "${MODEL_ID}" --local-dir "${TARGET_DIR}" --include "*.bin"
          fi

          if ! validate_model "${TARGET_DIR}"; then
              echo "::error title=Error::downloaded model at ${TARGET_DIR} is incomplete"
              exit 1
          fi
          share "${TARGET_DIR}"
          share "${HF_HOME}"
          echo "Model ready at ${TARGET_DIR}"

  prepare_embedding_model:
    if: ${{ inputs.runtype == 'all' && inputs.rag.embedding_model_source != 'local' }}
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Download Embedding Model
        early-cancel: any-job-failed
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          set -o pipefail
          set -x
          SOURCE="${{ inputs.rag.embedding_model_source }}"
          MODEL_ID="${{ inputs.rag.embedding_model_id }}"
          HF_TOKEN="${{ inputs.model.hf_token }}"
          CACHE_DIR="${{ inputs.rag.embedding_model_cache_dir }}"
          if [ -z "${CACHE_DIR}" ] || [ "${CACHE_DIR}" = "undefined" ]; then
              CACHE_DIR=~/pw/models
          fi
          CACHE_DIR="${CACHE_DIR/#\~/$HOME}"
          NAME="${MODEL_ID##*/}"
          # Same shared-or-private cache rule as prepare_model
          PRIVATE_CACHE_DIR="${HOME}/pw/software/models"

          usable_dir() { # writable if it exists, creatable if it does not
              if [ -d "$1" ]; then [ -w "$1" ]; else mkdir -p "$1" 2>/dev/null; fi
          }
          share() {
              case "$1" in "${HOME}"/*) return 0 ;; esac
              chmod -R g+rwX,o+rX "$1" 2>/dev/null
              find "$1" -type d -exec chmod g+s {} + 2>/dev/null
              chmod g+rwx,o+rx "${1%/*}" 2>/dev/null
              chmod g+s "${1%/*}" 2>/dev/null
              return 0
          }

          for d in "${CACHE_DIR}" "${PRIVATE_CACHE_DIR}"; do
              if [ -s "${d}/${NAME}/config.json" ]; then
                  share "${d}/${NAME}"
                  echo "Embedding model already cached at ${d}/${NAME}"
                  exit 0
              fi
          done
          if ! usable_dir "${CACHE_DIR}/${NAME}"; then
              echo "::warning::${CACHE_DIR} is not writable; downloading ${MODEL_ID} into ${PRIVATE_CACHE_DIR}"
              CACHE_DIR="${PRIVATE_CACHE_DIR}"
              if ! usable_dir "${CACHE_DIR}/${NAME}"; then
                  echo "::error title=Error::cannot create ${CACHE_DIR}/${NAME}"
                  exit 1
              fi
          fi
          TARGET_DIR="${CACHE_DIR}/${NAME}"
          # Keep HF working caches off the small $HOME filesystem where possible
          export HF_HOME="${CACHE_DIR}/cache"
          usable_dir "${HF_HOME}" || export HF_HOME="${PRIVATE_CACHE_DIR}/cache"

          if [ "${SOURCE}" = "bucket" ]; then
              BUCKET="${{ inputs.rag.embedding_model_bucket }}"
              BUCKET="${BUCKET%/}"
              SAFE_ID="${MODEL_ID//\//__}"
              pw bucket cp -r "${BUCKET}/${MODEL_ID##*/}" "${CACHE_DIR}" 2>/dev/null || \
                  pw bucket cp -r "${BUCKET}/${SAFE_ID}" "${CACHE_DIR}" || {
                  echo "::error title=Error::failed to pull embedding model from ${BUCKET}"
                  exit 1
              }
              if [ -d "${CACHE_DIR}/${SAFE_ID}" ] && [ ! -s "${TARGET_DIR}/config.json" ]; then
                  rmdir "${TARGET_DIR}" 2>/dev/null
                  mv "${CACHE_DIR}/${SAFE_ID}" "${TARGET_DIR}"
              fi
          else
              VENV_BASE="${{ inputs.service.parent_install_dir }}"
              if [ -z "${VENV_BASE}" ] || [ "${VENV_BASE}" = "undefined" ]; then
                  VENV_BASE=${HOME}/pw/software
              fi
              HF_BIN=""
              for d in "${VENV_BASE/#\~/$HOME}/.hfcli" "${HOME}/pw/software/.hfcli"; do
                  for b in "${d}/bin/hf" "${d}/bin/huggingface-cli"; do
                      if [ -x "${b}" ]; then
                          HF_BIN="${b}"
                          break 2
                      fi
                  done
              done
              if [ -z "${HF_BIN}" ]; then
                  VENV="${VENV_BASE/#\~/$HOME}/.hfcli"
                  usable_dir "${VENV}" || VENV="${HOME}/pw/software/.hfcli"
                  if ! python3 -m venv "${VENV}"; then
                      echo "::error title=Error::python3 -m venv failed; install python3/python3-venv on the cluster"
                      exit 1
                  fi
                  "${VENV}/bin/pip" install --quiet --upgrade 'huggingface_hub[hf_transfer]'
                  share "${VENV}"
                  HF_BIN="${VENV}/bin/hf"
                  [ -x "${HF_BIN}" ] || HF_BIN="${VENV}/bin/huggingface-cli"
              fi
              if [ -n "${HF_TOKEN}" ] && [ "${HF_TOKEN}" != "undefined" ]; then
                  export HF_TOKEN
              fi
              "${HF_BIN}" download "${MODEL_ID}" --local-dir "${TARGET_DIR}" || {
                  echo "::error title=Error::embedding model download failed"
                  exit 1
              }
          fi

          if [ ! -s "${TARGET_DIR}/config.json" ]; then
              echo "::error title=Error::embedding model at ${TARGET_DIR} is incomplete"
              exit 1
          fi
          share "${TARGET_DIR}"
          share "${HF_HOME}"
          echo "Embedding model ready at ${TARGET_DIR}"

  script_submitter:
    needs:
      - preprocessing
      - prepare_model
      - prepare_embedding_model
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Script Submitter
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: ${{ inputs.service.name }}-${PW_RUN_SLUG}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          healthy: '2*|3*|401'
          path: /v1/models
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - script_submitter

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: GPU cluster
        include-workspace: false
      cluster:
        hidden: ${{ inputs.resource.schedulerType == '' }}
        ignore: ${{ inputs.resource.schedulerType == '' }}
        type: group
        label: Compute cluster settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Submit to the scheduler
            description: Otherwise the job runs on the login node.
          slurm:
            type: group
            label: SLURM directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM Enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.resource }}
              time:
                label: Walltime
                description: HH:MM:SS, or D-HH:MM:SS for runs over a day.
                type: string
                default: '04:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                step: 1
                default: 0
                hidden: ${{ inputs.resource.ip != 'dn-slurm-1.parallel.works' }}
                ignore: ${{ .hidden }}
                tooltip: '--gpus= SLURM directive to set the number of GPUs allocated for the job'
              scheduler_directives:
                type: editor
                label: Scheduler directives
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --gres=gpu:1
          pbs:
            type: group
            label: PBS directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler directives
                type: editor
                optional: true
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1

      runtype:
        label: Deployment type
        type: dropdown
        default: vllm
        tooltip: Deploy vLLM only or the full vLLM+RAG stack
        options:
          - value: vllm
            label: vLLM Only
          - value: all
            label: vLLM + RAG (Chroma)

      model:
        type: group
        label: Model configuration
        items:
          source:
            type: dropdown
            label: Model source
            default: huggingface
            tooltip: Use a pre-downloaded model (local) or download from HuggingFace
            options:
              - value: local
                label: "📁 Local Path (pre-staged weights)"
              - value: huggingface
                label: "🤗 HuggingFace Download"
          local_path:
            type: string
            label: Model path
            placeholder: /path/to/model/weights
            default: /models/Llama-3_3-Nemotron-Super-49B-v1_5
            prefillDefault: true
            tooltip: Full path to directory containing model weights
            hidden: ${{ inputs.model.source != 'local' }}
            ignore: ${{ inputs.model.source != 'local' }}
          hf_model_id:
            type: string
            label: HuggingFace model ID
            placeholder: openai/gpt-oss-20b
            default: openai/gpt-oss-20b
            prefillDefault: true
            tooltip: Model ID to download from HuggingFace. Default is gpt-oss-20b, a 20B MoE model compatible with the openai tool call parser.
            hidden: ${{ inputs.model.source != 'huggingface' }}
            ignore: ${{ inputs.model.source != 'huggingface' }}
          hf_token:
            label: HuggingFace token
            description: Required for gated models such as Llama.
            default: ${{ org.HF_TOKEN }}
            type: password
            optional: true
            hidden: ${{ inputs.model.source != 'huggingface' }}
            ignore: ${{ inputs.model.source != 'huggingface' }}
          cache_dir:
            type: string
            label: Model cache directory
            description: Downloaded once and reused by later runs; needs disk space.
            default: ~/pw/models
            prefillDefault: true
            tooltip: Directory to download the model into. The model is downloaded once and reused for subsequent runs. Ensure sufficient disk space.
            hidden: ${{ inputs.model.source != 'huggingface' }}
            ignore: ${{ inputs.model.source != 'huggingface' }}
          chat_template:
            type: string
            label: Chat template override
            description: Leave blank to auto-detect; needed for models whose tokenizer ships no template.
            optional: true
            default: ""
            tooltip: >
              Path (on the cluster) to a Jinja2 chat template file, for models
              whose tokenizer does not ship one -- as of transformers v4.44,
              vLLM's chat endpoint errors instead of falling back to a default
              ("default chat template is no longer allowed"), which affects
              base/completion-only checkpoints such as OLMo. Leave blank to
              auto-detect: the tokenizer's own template is used when present,
              otherwise this workflow falls back to a bundled Alpaca-style
              template matching the finetuning workflow's training format.

      vllm:
        type: group
        label: vLLM settings
        collapsed: true
        items:
          num_gpus:
            type: dropdown
            label: Number of GPUs
            description: Tensor parallelism; must match the GPUs available.
            default: "1"
            options:
              - value: "1"
                label: "1 GPU"
              - value: "2"
                label: "2 GPUs"
              - value: "4"
                label: "4 GPUs"
              - value: "8"
                label: "8 GPUs"
          gpu_memory:
            type: dropdown
            label: GPU memory utilization
            description: Lower it on out-of-memory errors.
            default: "0.85"
            options:
              - value: "0.95"
                label: "95% (Maximum)"
              - value: "0.90"
                label: "90%"
              - value: "0.85"
                label: "85% (Recommended)"
              - value: "0.80"
                label: "80%"
              - value: "0.70"
                label: "70% (Conservative)"
          max_model_len:
            type: dropdown
            label: Max context length
            description: Lower values use less memory.
            default: "auto"
            options:
              - value: "auto"
                label: "Auto (use model default)"
              - value: "4096"
                label: "4K tokens"
              - value: "8192"
                label: "8K tokens"
              - value: "16384"
                label: "16K tokens"
              - value: "32768"
                label: "32K tokens"
              - value: "65536"
                label: "64K tokens"
              - value: "131072"
                label: "128K tokens"
          dtype:
            type: dropdown
            label: Data type
            description: Custom takes --dtype from the additional arguments.
            default: bfloat16
            options:
              - value: bfloat16
                label: "bfloat16 (Recommended for A100/H100)"
              - value: float16
                label: "float16 (Better compatibility)"
              - value: auto
                label: "Auto (model default)"
              - value: custom
                label: "Custom (specify in extra args)"
          attention_backend:
            type: dropdown
            label: vLLM attention backend
            default: TRITON_ATTN
            options: [FLASH_ATTN, TRITON_ATTN, FLASHINFER, FLASHINFER_MLA, TRITON_MLA, CUTLASS_MLA, FLASHMLA, FLASHMLA_SPARSE, FLASH_ATTN_MLA, TORCH_SDPA, ROCM_ATTN, ROCM_AITER_MLA, ROCM_AITER_TRITON_MLA, ROCM_AITER_FA, PALLAS, IPEX, CPU_ATTN, NO_ATTENTION, CUSTOM]
          extra_args:
            type: string
            label: Additional arguments
            default: "--trust_remote_code --async-scheduling --enable-auto-tool-choice --tool-call-parser openai"
            prefillDefault: true
            placeholder: "--trust_remote_code --async-scheduling --enable-auto-tool-choice --tool-call-parser openai"
            tooltip: Additional vLLM arguments. If dtype is 'Custom', include --dtype here.
            optional: true

      rag:
        type: group
        label: RAG settings
        hidden: ${{ inputs.runtype != 'all' }}
        collapsed: true
        items:
          docsdir:
            label: Documents directory
            description: Relative paths resolve inside the run directory.
            optional: true
            default: ./docs
            type: string
          max_tokens:
            type: dropdown
            label: Max response tokens
            description: Longer responses use more memory.
            default: "8192"
            options:
              - value: "2048"
                label: "2K tokens"
              - value: "4096"
                label: "4K tokens"
              - value: "8192"
                label: "8K tokens (Recommended)"
              - value: "16384"
                label: "16K tokens"
              - value: "32768"
                label: "32K tokens"
          embedding_model_source:
            label: Embedding model source
            type: dropdown
            default: huggingface
            options:
              - value: local
                label: "📁 Local Path (pre-staged weights)"
              - value: huggingface
                label: "🤗 HuggingFace Download"
              - value: bucket
                label: "📥 Pull from bucket"
          embedding_model_id:
            label: Embedding model ID
            type: string
            default: sentence-transformers/all-MiniLM-L6-v2
            tooltip: HuggingFace model ID for embeddings (also used to resolve the bucket folder name)
            hidden: ${{ inputs.rag.embedding_model_source == 'local' }}
            ignore: ${{ inputs.rag.embedding_model_source == 'local' }}
          embedding_model_path:
            label: Embedding model path
            type: string
            optional: true
            hidden: ${{ inputs.rag.embedding_model_source != 'local' }}
            ignore: ${{ inputs.rag.embedding_model_source != 'local' }}
          embedding_model_cache_dir:
            label: Embedding model cache directory
            type: string
            default: ~/pw/models
            tooltip: Directory to store the embedding model (HuggingFace or bucket)
            hidden: ${{ inputs.rag.embedding_model_source == 'local' }}
            ignore: ${{ inputs.rag.embedding_model_source == 'local' }}
          embedding_model_bucket:
            label: Embedding model bucket
            type: string
            default: pw://mshaxted/codeassist
            tooltip: Bucket base path containing embedding models by folder name
            hidden: ${{ inputs.rag.embedding_model_source != 'bucket' }}
            ignore: ${{ inputs.rag.embedding_model_source != 'bucket' }}
          systemprompt:
            type: string
            label: System prompt
            textarea: true
            optional: true
            default: You are a careful assistant. Use ONLY the provided context blocks to answer. Each block is numbered [1], [2], … and includes source metadata. When you use information from a block, you MUST cite it inline with [n]. At the end of your response, include a 'References' section with one reference per line formatted as [n] file_path (chunk index). Do not invent citations or sources. If the context does not contain the answer, say so briefly.

      service:
        type: group
        label: Advanced settings
        collapsed: true
        items:
          name:
            type: string
            hidden: true
            default: vllm
          parent_install_dir:
            label: Parent install directory
            description: Needs enough free space for the container images.
            type: string
            default: ${HOME}/pw/software
            tooltip: The container image and tools are installed in this directory. Ensure it has sufficient space!
          container_uri:
            label: vLLM container
            type: string
            default: ghcr.io/parallelworks/vllm:v1.0
            tooltip: ORAS artifact containing the vLLM SIF image
          rag_container_uri:
            label: RAG container
            type: string
            default: ghcr.io/parallelworks/rag:v1.0
            tooltip: ORAS artifact containing the RAG SIF image
            hidden: ${{ inputs.runtype != 'all' }}
          rundir:
            label: RAG run directory
            description: Keep the path short.
            type: string
            default: ~/pw/workflows
            tooltip: The RAG stack is copied here from the checkout and runs from it. Keep the path short.
            hidden: ${{ inputs.runtype != 'all' }}
