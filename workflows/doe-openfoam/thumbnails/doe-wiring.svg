<svg xmlns="http://www.w3.org/2000/svg" width="960" height="484" viewBox="0 0 960 484" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a9850"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker>
  </defs>
  <rect width="960" height="484" rx="10" fill="#fcfcfb" stroke="#d8d5cf"/>

  <!-- general.yaml -->
  <rect x="18" y="18" width="336" height="448" rx="8" fill="#f4f3ef" stroke="#c3c2b7"/>
  <text x="30" y="42" font-size="15" font-weight="bold" fill="#0b0b0b">general.yaml</text>
  <text x="30" y="60" font-size="12" fill="#52514e">the run</text>

  <rect x="30" y="76" width="312" height="150" rx="6" fill="#ffffff" stroke="#898781"/>
  <text x="40" y="94" font-size="13" fill="#0b0b0b">preprocessing</text>
  <text x="40" y="112" font-size="11" fill="#52514e">checks the OpenFOAM and ParaView environments</text>
  <rect x="40" y="122" width="292" height="34" rx="6" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="50" y="137" font-size="12" fill="#2a78d6">uses: workflows/doe  (sample n designs)</text>
  <text x="50" y="151" font-size="11" fill="#52514e">cases/case_j/params.in, doe.csv &#8594; N_CASES</text>
  <rect x="40" y="164" width="292" height="54" rx="6" fill="#fff3ec" stroke="#eb6834"/>
  <text x="50" y="180" font-size="12" fill="#0b0b0b">uses: workflows/design-explorer  (images on)</text>
  <text x="50" y="195" font-size="11" fill="#52514e">starts the server detached on the login node,</text>
  <text x="50" y="209" font-size="11" fill="#52514e">waits for /healthz, cleans up a dead server</text>

  <rect x="30" y="246" width="312" height="120" rx="6" fill="#edf7f0" stroke="#1a9850" stroke-width="1.5"/>
  <text x="40" y="264" font-size="13" fill="#0b0b0b">workers  <tspan font-size="11" fill="#52514e">matrix job_id 1..n_cases</tspan></text>
  <text x="40" y="280" font-size="11" fill="#52514e">if: job_id &#8804; N_CASES, max-parallel = cases at a time</text>
  <text x="40" y="300" font-size="12" fill="#1a9850">uses: workflows/openfoam-naca  (general.yaml)</text>
  <text x="40" y="316" font-size="11" fill="#52514e">params_file + case_dir = cases/case_j</text>
  <text x="40" y="330" font-size="11" fill="#52514e">generate_images = the form's switch</text>
  <text x="40" y="350" font-size="11" fill="#52514e">one OpenFOAM case per design, its images next to it</text>

  <rect x="30" y="384" width="312" height="70" rx="6" fill="#ffffff" stroke="#898781"/>
  <text x="40" y="402" font-size="13" fill="#0b0b0b">results  <tspan font-size="11" fill="#52514e">if: always()</tspan></text>
  <text x="40" y="418" font-size="11" fill="#52514e">study.py: every case_j &#8594; results.csv,</text>
  <text x="40" y="432" font-size="11" fill="#52514e">each OK, FAILED or PENDING</text>
  <text x="40" y="446" font-size="11" fill="#52514e">fails only when no case solved</text>

  <!-- the server's arrow before the cases panel, which hides the part behind it -->
  <line x1="332" y1="191" x2="668" y2="150" stroke="#eb6834" stroke-width="1.5" marker-end="url(#aO)"/>

  <!-- the cases directory -->
  <rect x="388" y="76" width="246" height="378" rx="8" fill="#f4f3ef" stroke="#c3c2b7"/>
  <text x="400" y="100" font-size="15" font-weight="bold" fill="#0b0b0b">cases/</text>
  <text x="400" y="118" font-size="12" fill="#52514e">in the run's job directory</text>
  <text x="400" y="144" font-size="12" fill="#0b0b0b">doe.csv</text>
  <text x="412" y="160" font-size="11" fill="#52514e">the designs as a table</text>
  <text x="400" y="186" font-size="12" fill="#0b0b0b">case_1/ ... case_n/</text>
  <text x="412" y="204" font-size="11" fill="#2a78d6">params.in</text>
  <text x="412" y="220" font-size="11" fill="#1a9850">results.out  or  exit_code</text>
  <text x="412" y="236" font-size="11" fill="#1a9850">case/case.foam</text>
  <text x="412" y="252" font-size="11" fill="#1a9850">images/pressure.png, velocity.png,</text>
  <text x="412" y="266" font-size="11" fill="#1a9850">streamlines, turbulence, wake, mesh</text>
  <text x="400" y="296" font-size="12" fill="#0b0b0b">results.csv</text>
  <text x="412" y="312" font-size="11" fill="#52514e">every case, its status,</text>
  <text x="412" y="326" font-size="11" fill="#52514e">inputs and coefficients</text>
  <text x="400" y="356" font-size="12" fill="#0b0b0b">data.csv</text>
  <text x="412" y="372" font-size="11" fill="#52514e">the solved cases in</text>
  <text x="412" y="386" font-size="11" fill="#52514e">Design Explorer's format</text>
  <text x="412" y="400" font-size="11" fill="#52514e">(in:, out:, img: columns)</text>

  <!-- the page -->
  <rect x="668" y="76" width="274" height="378" rx="8" fill="#fff3ec" stroke="#eb6834"/>
  <text x="680" y="100" font-size="15" font-weight="bold" fill="#0b0b0b">design-explorer-&lt;run slug&gt;</text>
  <text x="680" y="118" font-size="12" fill="#52514e">the pw endpoint, login node</text>
  <text x="680" y="144" font-size="12" fill="#0b0b0b">design-explorer-server.py</text>
  <text x="680" y="162" font-size="11" fill="#52514e">serves design-explorer.html over Design</text>
  <text x="680" y="176" font-size="11" fill="#52514e">Explorer's libraries (downloaded once)</text>
  <text x="680" y="196" font-size="11" fill="#52514e">/data/data.csv rebuilt from cases/</text>
  <text x="680" y="210" font-size="11" fill="#52514e">on every request; /data/case_j/images/*</text>
  <!-- a sketch of the parallel coordinates -->
  <rect x="680" y="226" width="250" height="162" rx="6" fill="#ffffff" stroke="#898781"/>
  <g stroke="#c3c2b7" stroke-width="1">
    <line x1="704" y1="240" x2="704" y2="330"/><line x1="742" y1="240" x2="742" y2="330"/><line x1="780" y1="240" x2="780" y2="330"/><line x1="818" y1="240" x2="818" y2="330"/><line x1="856" y1="240" x2="856" y2="330"/><line x1="894" y1="240" x2="894" y2="330"/>
  </g>
  <g fill="none" stroke-width="1.3" opacity="0.85">
    <polyline points="704,300 742,262 780,316 818,250 856,290 894,270" stroke="#2a78d6"/>
    <polyline points="704,252 742,322 780,268 818,300 856,258 894,318" stroke="#2a78d6"/>
    <polyline points="704,276 742,284 780,246 818,326 856,310 894,246" stroke="#2a78d6"/>
    <polyline points="704,318 742,248 780,296 818,276 856,266 894,296" stroke="#eb6834" stroke-width="2"/>
  </g>
  <g font-size="8" fill="#52514e" text-anchor="middle">
    <text x="704" y="344">camber</text><text x="742" y="344">position</text><text x="780" y="344">thickness</text><text x="818" y="344">alpha</text><text x="856" y="344">Cd</text><text x="894" y="344">Cl</text>
  </g>
  <text x="692" y="364" font-size="10" fill="#52514e">brush an axis to filter;</text>
  <text x="692" y="377" font-size="10" fill="#52514e">click a design for its images</text>
  <text x="680" y="412" font-size="11" fill="#52514e">keeps serving after the run, until</text>
  <text x="680" y="426" font-size="11" fill="#52514e">pw endpoints delete design-explorer-&lt;slug&gt;</text>

  <!-- arrows -->
  <line x1="332" y1="139" x2="388" y2="150" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#aB)"/>
  <line x1="342" y1="306" x2="388" y2="306" stroke="#1a9850" stroke-width="1.5" marker-end="url(#aG)"/>
  <line x1="388" y1="236" x2="342" y2="252" stroke="#1a9850" stroke-width="1.5" marker-end="url(#aG)"/>
  <line x1="342" y1="420" x2="388" y2="404" stroke="#52514e" stroke-width="1.5" marker-end="url(#aK)"/>
  <line x1="634" y1="260" x2="668" y2="200" stroke="#eb6834" stroke-width="1.5" marker-end="url(#aO)"/>
</svg>
