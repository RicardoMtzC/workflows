# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'
env:
  PW_API_KEY: ${PW_API_KEY}

jobs:
  wait_for_endpoint:
    ssh:
      remoteHost: ${{ inputs.host }}
    steps:
      - name: Wait for endpoint
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          endpoint_name="${{ inputs.endpoint_name }}"
          echo "::notice::Waiting for endpoint ${endpoint_name} to come online"
          # Match the name column exactly: grep -w treats a dash as a word boundary, so
          # a short name would accept any longer endpoint that starts with it.
          until pw endpoints list | awk -F'\t' '{print $1}' | grep -qxF "${endpoint_name}"; do
            echo "$(date) Endpoint ${endpoint_name} not found yet; retrying in 10 seconds"
            sleep 10
          done
          echo "::notice::Endpoint ${endpoint_name} is online"
      - name: Check endpoint health
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          endpoint_name="${{ inputs.endpoint_name }}"
          url=$(pw endpoints list | awk -F'\t' -v name="${endpoint_name}" '$1 == name {print $3}')
          if [ -z "${url}" ]; then
            echo "::error title=Error::Endpoint ${endpoint_name} is no longer listed"
            exit 1
          fi
          # Path-based endpoints (--no-subdomain) are listed as a path, not a URL
          case "${url}" in
            /*) url="https://${PW_PLATFORM_HOST}${url}" ;;
          esac
          path="${{ inputs.path }}"
          case "${path}" in
            ''|undefined) probe_url="${url}" ;;
            *) probe_url="${url%/}${path}" ;;
          esac
          # Anonymous requests never get past the platform's login redirect (307),
          # so the probe carries the run's key: the answer is then the service's own,
          # and a tunnel with nothing listening behind it answers 503. Query strings
          # stay out of the log: some slugs carry a password.
          if [ -z "${PW_API_KEY}" ]; then
            echo "::error title=Error::PW_API_KEY is not set; cannot probe ${probe_url%%\?*}"
            exit 1
          fi
          echo "::notice::Checking that ${probe_url%%\?*} answers"
          started=$(date +%s)
          while :; do
            resp=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time ${{ inputs.max_time }} -H "Authorization: Bearer ${PW_API_KEY}" "${probe_url}")
            code="${resp%% *}"
            location="${resp#* }"
            seen="HTTP ${code}${location:+ -> ${location%%\?*}}"
            elapsed=$(( $(date +%s) - started ))
            case "${code}" in
              ${{ inputs.healthy }})
                echo "::notice::Endpoint ${endpoint_name} is healthy: ${seen} from ${probe_url%%\?*} after ${elapsed}s"
                skip_file="${{ inputs.skip_cleanups_file }}"
                case "${skip_file}" in
                  ''|undefined) ;;
                  *) touch "${skip_file}"; sleep 2 ;;
                esac
                exit 0
                ;;
            esac
            if [ "${elapsed}" -ge ${{ inputs.budget }} ]; then
              break
            fi
            echo "$(date) ${seen} from ${probe_url%%\?*} after ${elapsed}s; retrying in 5 seconds"
            sleep 5
          done
          # No skip file was written, so the caller's script submitter (cancelled by
          # early-cancel when this job fails) still owns the cleanup and tears the
          # service down; on Kubernetes the log-stream step's cleanups do the same.
          echo "::error title=Error::Endpoint ${endpoint_name} is unhealthy (${seen} from ${probe_url%%\?*} after ${elapsed}s)"
          exit 1

'on':
  execute:
    inputs:
      endpoint_name:
        label: Endpoint name
        type: string
        tooltip: The name shown by pw endpoints list, e.g. jupyterlab-host-${PW_RUN_SLUG} (shell variables are expanded on the probing host)
      host:
        label: Host to probe from
        type: string
        optional: true
        default: ''
        tooltip: IP of the login node (inputs.cluster.resource.ip); leave empty to probe from the workspace (Kubernetes)
      skip_cleanups_file:
        label: Skip-cleanups file
        type: string
        optional: true
        default: ''
        tooltip: Touched once the endpoint is healthy so the script submitter leaves the service running; leave empty on Kubernetes
      healthy:
        label: Healthy status pattern
        type: string
        default: '2*|3*'
        tooltip: Shell case pattern the HTTP status code must match, e.g. 2*|3* or 2*|3*|401
      budget:
        label: Retry budget (seconds)
        type: number
        default: 120
        tooltip: How long to keep probing every 5 seconds once the endpoint is listed before declaring it unhealthy
      path:
        label: Path to probe
        type: string
        optional: true
        default: ''
        tooltip: Appended to the listed URL, e.g. /v1/models; empty probes the listed URL itself
      max_time:
        label: Per-request timeout (seconds)
        type: number
        default: 20
