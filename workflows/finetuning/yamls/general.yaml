# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
---
# ==============================================================================
# Generalized LoRA / QLoRA Fine-tuning Workflow  (single node, 1+ GPUs)
# ==============================================================================
# Endpoint pattern (preprocessing -> script_submitter/v3.6 -> wait_for_endpoint),
# scaffolding ported from workflows/streamlit/yamls/general.yaml per HANDOFF.md
# sec1.5/1.6. Model matrix / resolver / container-mode / evaluation design carry
# over verbatim from the pre-port draft (HANDOFF sec2-5).
#
# TensorBoard is reachable at the endpoint's port only while training runs
# (app/start-template.sh); a persistent offline report (loss/eval-loss plots +
# metrics.json + report.html) is written under output_dir/report once training
# completes. The service script's cleanup trap (below) then explicitly runs
# `pw endpoints delete` on its own endpoint name -- relying on process death
# alone to deregister it was found to leave a stale entry in
# `pw endpoints list` after a normal, successful completion.
#
# TESTING: checkout branch below points at add-finetuning while iterating.
# Flip to canary before merging to canary.
# ==============================================================================

permissions:
  - "*"

jobs:
  preprocessing:
    needs:
      - resolve_strategy
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Checkout finetuning
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: add-finetuning
          sparse_checkout:
            - workflows/finetuning/app
            - tools/oras
        cleanup: |
          set -x
          if [ -d tools/oras ]; then
            echo "Removing tools/oras"
            rm -rf tools/oras
          fi
      - name: Create Inputs
        run: |
          set -x
          # base_model_id is resolved here, in bash, rather than via the YAML
          # input's own chained-ternary `default:` (model_profile == 'x' ? 'id'
          # : ...): that computed default was found (2026-09-10, first real
          # pw run of this workflow) to silently return garbage when the field
          # isn't explicitly supplied -- the runtime substitution engine
          # appears to fall back to the LAST quoted string literal in the raw
          # expression text (openai/gpt-oss-120b, the final profile branch)
          # regardless of model_profile. This is the risk HANDOFF.md sec8
          # flagged ("the parser fails SILENTLY on malformed expressions") --
          # confirmed, not theoretical. Simple (non-ternary) `${{ inputs.X }}`
          # references, like model_profile below, are unaffected -- only this
          # field's own computed default is broken, and only when relied upon.
          if [ "${{ inputs.model_source }}" = "local" ]; then
              resolved_base_model_id="${{ inputs.local_model_path }}"
          else
              case "${{ inputs.model_profile }}" in
                  olmo2-1b-dev)     resolved_base_model_id=allenai/OLMo-2-0425-1B ;;
                  olmoe-1b-7b-dev)  resolved_base_model_id=allenai/OLMoE-1B-7B-0924-Instruct ;;
                  gemma-1.1-7b)     resolved_base_model_id=google/gemma-1.1-7b-it ;;
                  gemma-4-31b)      resolved_base_model_id=google/gemma-4-31B-it ;;
                  gpt-oss-20b)      resolved_base_model_id=openai/gpt-oss-20b ;;
                  gpt-oss-120b)     resolved_base_model_id=openai/gpt-oss-120b ;;
                  *)                resolved_base_model_id="${{ inputs.base_model_id }}" ;;
              esac
              if [ -z "${resolved_base_model_id}" ] || printf '%s' "${resolved_base_model_id}" | grep -q "'"; then
                  echo "::error title=Error::base_model_id resolved to an empty/malformed value ('${resolved_base_model_id}') for model_profile=${{ inputs.model_profile }}. For model_profile=custom, base_model_id must be supplied explicitly (see HANDOFF.md sec8 on the chained-ternary default bug)."
                  exit 1
              fi
          fi
          # lora.quantization is resolved here, in bash, for exactly the reason
          # base_model_id is (see above). Its former chained-ternary default
          # mis-evaluated: for model_profile=gpt-oss-20b the first (parenthesized,
          # ||) branch is true and should yield 'native', but the engine emitted
          # the RAW SOURCE TEXT of a different branch -- "'4bit'\n", quotes and
          # newline intact. The newline then split the assignment across two
          # physical lines in inputs.sh and train.py died in argparse
          # ("invalid choice: \"'4bit'\\n\"") before loading a single weight.
          # Found 2026-09-15, run precise-ewe. Both gpt-oss profiles and
          # gemma-4-31b were affected; olmo/olmoe only escaped because their
          # correct answer coincided with the final fallback branch.
          #
          # 'auto' means "let train.py decide": an empty quantization makes
          # train-entrypoint.sh omit --quantization, and train.py's
          # resolve_quantization() applies PROFILE_QUANTIZATION_DEFAULT -- the
          # single source of truth the ternary was duplicating.
          resolved_quantization="${{ inputs.lora.quantization }}"
          if [ "${resolved_quantization}" = "auto" ]; then
              resolved_quantization=""
          fi
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # The HF token is the one secret on this form. Keep it out of
          # inputs.sh and its two copies (controller-*.sh, start-service-*.sh),
          # which persist in the job dir and are rendered verbatim into
          # logs/<job>/step_N/script-unstable.sh -- and out of xtrace. It goes
          # to a single 0600 sidecar that the scripts read at run time and
          # cleanup() shreds. Same reasoning as the PW_API_KEY strip above.
          if [ -z "${PW_PARENT_JOB_DIR:-}" ]; then
              echo "::error title=Error::PW_PARENT_JOB_DIR is unset; refusing to write the token sidecar to an unexpected path"
              exit 1
          fi
          set +x
          # An unset org secret renders as the literal string "undefined" (the
          # prepare_model job guards the same way) -- write an empty sidecar in
          # that case rather than a token of "undefined".
          _hf_tok="${{ inputs.hf_token }}"
          [ "${_hf_tok}" = "undefined" ] && _hf_tok=""
          ( umask 077; printf '%s' "${_hf_tok}" > "${PW_PARENT_JOB_DIR}/.hf_token" )
          unset _hf_tok
          chmod 600 "${PW_PARENT_JOB_DIR}/.hf_token"
          set -x
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          service_parent_install_dir="${{ inputs.service.parent_install_dir }}"
          container_mode="${{ inputs.container.container_mode }}"
          finetune_registry="${{ inputs.container.container_registry_uri }}"
          container_sif_path="${{ inputs.container.container_sif_path }}"
          container_requirements_file="${{ inputs.container.requirements_file }}"
          model_profile="${{ inputs.model_profile }}"
          model_source="${{ inputs.model_source }}"
          hf_token_file="${PW_PARENT_JOB_DIR}/.hf_token"
          model_cache_dir="${{ inputs.model_cache_dir }}"
          local_dataset_path="${{ inputs.dataset_config.local_dataset_path }}"
          dataset_format="${{ inputs.dataset_config.dataset_format }}"
          eval_split_fraction="${{ inputs.dataset_config.eval_split_fraction }}"
          prompt_field="${{ inputs.dataset_config.prompt_field }}"
          num_epochs="${{ inputs.training.num_epochs }}"
          learning_rate="${{ inputs.training.learning_rate }}"
          micro_batch_size="${{ inputs.training.micro_batch_size }}"
          gradient_accumulation="${{ inputs.training.gradient_accumulation }}"
          max_seq_length="${{ inputs.training.max_seq_length }}"
          lora_r="${{ inputs.lora.lora_r }}"
          lora_alpha="${{ inputs.lora.lora_alpha }}"
          lora_dropout="${{ inputs.lora.lora_dropout }}"
          eval_steps="${{ inputs.evaluation.eval_steps }}"
          quality_eval_type="${{ inputs.evaluation.quality_eval_type }}"
          tensorboard_enabled="${{ inputs.tensorboard_enabled }}"
          output_dir="${{ inputs.output_dir }}"
          merge_full_weights="${{ inputs.merge_full_weights }}"
          strategy="${{ needs.resolve_strategy.outputs.STRATEGY }}"
          launcher="${{ needs.resolve_strategy.outputs.LAUNCHER }}"
          num_gpus="${{ inputs.num_gpus }}"
          lora_targets_override="${{ inputs.advanced.lora_targets_override }}"
          chat_template_override="${{ inputs.advanced.chat_template_override }}"
          response_template="${{ inputs.advanced.response_template }}"
          optim="${{ inputs.advanced.optim }}"
          gradient_checkpointing="${{ inputs.advanced.gradient_checkpointing }}"
          bf16="${{ inputs.advanced.bf16 }}"
          endpoint_name="${{ inputs.service.name }}-${PW_RUN_SLUG}"
          pw_endpoints_args="--name ${endpoint_name}"
          EOF
          echo "base_model_id=\"${resolved_base_model_id}\"" >> inputs.sh
          # Empty when 'auto'; the '/=""/d' sed below then drops the line
          # entirely, which is what makes train.py apply the profile default.
          echo "quantization=\"${resolved_quantization}\"" >> inputs.sh
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          # Only prefix genuine "VAR=" assignment lines, not a blanket
          # per-line sed: a value containing a literal embedded newline
          # (e.g. advanced.response_template's default "### Response:\n" --
          # YAML double-quoted \n is a real newline, not two characters)
          # splits across two physical lines here, and a blanket 's/^/export /'
          # would inject "export " into the orphaned continuation line,
          # corrupting the value (found 2026-09-10, first real pw run:
          # response_template silently became "### Response:\nexport ").
          sed -i -E 's/^([A-Za-z_][A-Za-z0-9_]*=)/export \1/' inputs.sh
          chmod 600 inputs.sh
      - name: Controller Preprocessing
        run: |
          set -x
          cp inputs.sh controller-${PW_JOB_ID}.sh
          chmod 600 controller-${PW_JOB_ID}.sh
          cat workflows/finetuning/app/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          cp inputs.sh start-service-${PW_JOB_ID}.sh
          chmod 600 start-service-${PW_JOB_ID}.sh
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              # Belt-and-suspenders: a process death should deregister its own
              # `pw endpoints run` entry, but this workflow has been observed
              # leaving a stale entry in `pw endpoints list` after training
              # completes normally. Explicitly delete it here so every exit
              # path (normal completion, error, cancel, signal) actually tears
              # the endpoint down, not just the local process tree.
              pw endpoints delete "${endpoint_name}" 2>/dev/null || true
              if [ -n "${hf_token_file:-}" ] && [ -f "${hf_token_file}" ]; then
                  shred -u "${hf_token_file}" 2>/dev/null || rm -f "${hf_token_file}"
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat workflows/finetuning/app/start-template.sh >> ./start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  # ==========================================================================
  # Resolve strategy  (footprint x GPUs -> precision/parallelism/launcher)
  # STRATEGY/num_gpus now drive app/train-entrypoint.sh's launch command
  # (single -> python; ddp/fsdp -> accelerate launch, see that script). LAUNCHER
  # here is informational only (echoed in the ::notice::); the actual launch
  # prefix + FSDP config path are assembled in train-entrypoint.sh itself.
  # ==========================================================================
  resolve_strategy:
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    outputs:
      STRATEGY: ${{ needs.resolve_strategy.steps.calc.outputs.STRATEGY }}
      LAUNCHER: ${{ needs.resolve_strategy.steps.calc.outputs.LAUNCHER }}
      PRECISION: ${{ needs.resolve_strategy.steps.calc.outputs.PRECISION }}
    steps:
      - name: Compute training strategy
        id: calc
        early-cancel: any-job-failed
        run: |
          set -euo pipefail
          NUM_GPUS=${{ inputs.num_gpus }}
          VRAM=${{ inputs.vram_gb_per_gpu }}
          PROFILE="${{ inputs.model_profile }}"
          OVERRIDE="${{ inputs.advanced.parallelism_override }}"

          # Frozen base-weight footprint (GB), 4-bit/native basis.
          # TODO(stub): for 'custom', estimate from config.json param count.
          case "$PROFILE" in
            olmo2-1b-dev)     FOOTPRINT=2  ;;
            olmoe-1b-7b-dev)  FOOTPRINT=4  ;;
            gemma-1.1-7b)     FOOTPRINT=5  ;;
            gemma-4-31b)      FOOTPRINT=18 ;;
            gpt-oss-20b)      FOOTPRINT=13 ;;
            gpt-oss-120b)     FOOTPRINT=63 ;;
            *)                FOOTPRINT=20 ;;
          esac

          # Overhead constant lowered 8->6 (2026-09-04): the original +8 guess
          # made gemma-1.1-7b (FOOTPRINT=5) need 16GB/GPU, which never fits a
          # real ~15GB T4 -- backwards from the intended DDP pick for that
          # profile on 4xT4. LoRA (not full fine-tuning) keeps optimizer state
          # tiny, so a smaller flat overhead is more realistic.
          #
          # Measured on 4x Tesla T4 (15360MiB), nvidia-smi sampled every 3s,
          # micro_batch=2 x grad_accum=2, max_seq_len=256, LoRA r=16, 4-bit:
          #   olmoe-1b-7b-dev  FOOTPRINT=4 -> predicted 12GB, measured ~10.2GB
          #   gemma-1.1-7b     FOOTPRINT=5 -> predicted 14GB, measured 10.9GB
          #                                   training, 13.1GB peak on rank 0
          # Conservative in the safe direction for both, and it correctly
          # selects ddp for gemma-1.1-7b on 4x15GB. NOTE the peak is NOT the
          # training loop -- it is the rank-0-only merge_and_unload() after
          # training (13.1GB vs 10.9GB), leaving just ~0.9GB of margin under
          # the predicted 14GB. Any future retune must keep covering the merge
          # spike, not just the steady-state training footprint, or set
          # merge_full_weights=false for tight-memory runs.
          # fsdp validated at 32B (OLMo-2-0325-32B-Instruct, 4-bit, 4x T4):
          # reached via the generic FOOTPRINT=20 fallback -> NEED_PER_GPU=38 vs
          # 15GB/GPU -> fsdp. Measured ~9.4GB/GPU training, 13.1GB balanced
          # peak during the state-dict gather. CAVEAT: for FSDP+QLoRA the
          # binding constraint is the *load* peak (each rank would otherwise
          # materialize the whole model), which this formula does not model --
          # it only survives because fsdp_config.yaml sets
          # fsdp_cpu_ram_efficient_loading. See PLAN.md.
          # gemma-4-31b itself is still blocked (transformers lacks the gemma4
          # architecture), unrelated to the fit math.
          NEED_PER_GPU=$(python3 -c "print(int($FOOTPRINT*1.6)+6)")

          if [ "$OVERRIDE" != "auto" ]; then
            STRATEGY="$OVERRIDE"
          elif [ "$NUM_GPUS" -eq 1 ]; then
            STRATEGY="single"
          elif [ "$FOOTPRINT" -lt "$VRAM" ] && [ "$NEED_PER_GPU" -lt "$VRAM" ]; then
            STRATEGY="ddp"
          else
            STRATEGY="fsdp"
          fi

          case "$STRATEGY" in
            single) LAUNCHER="python" ;;
            ddp)    LAUNCHER="accelerate launch --multi_gpu --num_processes ${NUM_GPUS}" ;;
            fsdp)   LAUNCHER="accelerate launch --num_processes ${NUM_GPUS} --config_file app/fsdp_config.yaml" ;;
          esac

          PRECISION="${{ inputs.lora.quantization }}"

          echo "STRATEGY=$STRATEGY"   >> $OUTPUTS
          echo "LAUNCHER=$LAUNCHER"   >> $OUTPUTS
          echo "PRECISION=$PRECISION" >> $OUTPUTS
          echo "::notice::profile=$PROFILE footprint=${FOOTPRINT}GB gpus=${NUM_GPUS}x${VRAM}GB -> ${STRATEGY} (${LAUNCHER}), precision=${PRECISION}"

  # ==========================================================================
  # Prepare model  (login-node HF download -> flat, human-named cache dir)
  # Ported from workflows/rag-vllm/yamls/general.yaml's prepare_model job so
  # both workflows manage HuggingFace weights the same way: a plain
  # <cache_dir>/<repo-basename>/ directory (config.json, *.safetensors,
  # tokenizer files directly inside it), not huggingface_hub's own hashed
  # models--org--name/blobs/refs/snapshots/<hash>/ cache layout. Runs in
  # parallel with `preprocessing` (no needs edge between them -- see
  # app/controller.sh, which independently recomputes this same path); only
  # `session_runner` waits on both, so the model is always fully staged
  # before start-template.sh tries to load it.
  # ==========================================================================
  prepare_model:
    if: ${{ inputs.model_source == 'huggingface' }}
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Download Model
        early-cancel: any-job-failed
        run: |
          set -o pipefail
          set -x
          # See preprocessing's "Create Inputs" step for why this is a bash
          # case on model_profile rather than a reference to base_model_id's
          # own (broken) chained-ternary default -- same fix, same reason.
          case "${{ inputs.model_profile }}" in
              olmo2-1b-dev)     MODEL_ID=allenai/OLMo-2-0425-1B ;;
              olmoe-1b-7b-dev)  MODEL_ID=allenai/OLMoE-1B-7B-0924-Instruct ;;
              gemma-1.1-7b)     MODEL_ID=google/gemma-1.1-7b-it ;;
              gemma-4-31b)      MODEL_ID=google/gemma-4-31B-it ;;
              gpt-oss-20b)      MODEL_ID=openai/gpt-oss-20b ;;
              gpt-oss-120b)     MODEL_ID=openai/gpt-oss-120b ;;
              *)                MODEL_ID="${{ inputs.base_model_id }}" ;;
          esac
          if [ -z "${MODEL_ID}" ] || printf '%s' "${MODEL_ID}" | grep -q "'"; then
              echo "::error title=Error::base_model_id resolved to an empty/malformed value ('${MODEL_ID}') for model_profile=${{ inputs.model_profile }}. For model_profile=custom, base_model_id must be supplied explicitly (see HANDOFF.md sec8 on the chained-ternary default bug)."
              exit 1
          fi
          HF_TOKEN="${{ inputs.hf_token }}"
          CACHE_DIR="${{ inputs.model_cache_dir }}"
          CACHE_DIR="${CACHE_DIR/#\~/$HOME}"
          TARGET_DIR="${CACHE_DIR}/${MODEL_ID##*/}"

          validate_model() {
              [ -s "${TARGET_DIR}/config.json" ] || return 1
              local f
              f=$(find "${TARGET_DIR}" -maxdepth 1 \( -name '*.safetensors' -o -name '*.bin' \) -size +1M 2>/dev/null | head -1)
              [ -n "$f" ]
          }

          if validate_model; then
              echo "Model already cached at ${TARGET_DIR}"
              exit 0
          fi
          # hf download is incremental: it resumes a partial download in place
          # and only fetches files that are missing or changed
          mkdir -p "${CACHE_DIR}"

          VENV_BASE="${{ inputs.service.parent_install_dir }}"
          if [ -z "${VENV_BASE}" ] || [ "${VENV_BASE}" = "undefined" ]; then
              VENV_BASE=${HOME}/pw/software
          fi
          VENV="${VENV_BASE/#\~/$HOME}/.hfcli"
          HF_BIN="${VENV}/bin/hf"
          [ -x "${HF_BIN}" ] || HF_BIN="${VENV}/bin/huggingface-cli"
          if [ ! -x "${HF_BIN}" ]; then
              if ! python3 -m venv "${VENV}"; then
                  echo "::error title=Error::python3 -m venv failed; install python3/python3-venv on the cluster"
                  exit 1
              fi
              "${VENV}/bin/pip" install --quiet --upgrade 'huggingface_hub[hf_transfer]'
              HF_BIN="${VENV}/bin/hf"
              [ -x "${HF_BIN}" ] || HF_BIN="${VENV}/bin/huggingface-cli"
          fi

          if [ -n "${HF_TOKEN}" ] && [ "${HF_TOKEN}" != "undefined" ]; then
              export HF_TOKEN
          fi
          export HF_HUB_ENABLE_HF_TRANSFER=1
          for attempt in 1 2 3; do
              if "${HF_BIN}" download "${MODEL_ID}" --local-dir "${TARGET_DIR}" \
                  --exclude "original/*" --exclude "metal/*" --exclude "*.bin" \
                  --exclude "*.gguf" --exclude "*.onnx" --exclude "consolidated*.pth"; then
                  break
              fi
              if [ "${attempt}" = 3 ]; then
                  echo "::error title=Error::model download failed after 3 attempts"
                  exit 1
              fi
              # hf_transfer can be flaky on some networks; retry without it
              unset HF_HUB_ENABLE_HF_TRANSFER
              sleep $((attempt * 5))
          done

          # Some models only ship bin weights
          if ! ls "${TARGET_DIR}"/*.safetensors >/dev/null 2>&1; then
              "${HF_BIN}" download "${MODEL_ID}" --local-dir "${TARGET_DIR}" --include "*.bin"
          fi

          if ! validate_model; then
              echo "::error title=Error::downloaded model at ${TARGET_DIR} is incomplete"
              exit 1
          fi
          echo "Model ready at ${TARGET_DIR}"

  session_runner:
    needs:
      - preprocessing
      - prepare_model
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        run: |
          endpoint_name="${{ inputs.service.name }}-${PW_RUN_SLUG}"
          echo "::notice::Waiting for endpoint ${endpoint_name} to come online"
          until pw endpoints list | grep -qw "${endpoint_name}"; do
            echo "$(date) Endpoint ${endpoint_name} not found yet; retrying in 10 seconds"
            sleep 10
          done
          echo "::notice::Endpoint ${endpoint_name} is online"
          touch ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          sleep 2
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

'on':
  execute:
    inputs:

      # ----------------------------------------------------------------------
      # 1. HARDWARE PROFILE
      # ----------------------------------------------------------------------
      cluster:
        type: group
        label: Compute Cluster Settings
        items:
          resource:
            type: compute-clusters
            label: Service host
            include-workspace: false
            tooltip: Resource to host the service
          scheduler:
            type: boolean
            default: false
            label: Schedule Job?
            hidden: ${{ inputs.cluster.resource.schedulerType == '' }}
            ignore: ${{ .hidden }}
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM Enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.cluster.resource }}
              time:
                label: Walltime
                type: string
                default: '01:00:00'
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                default: 1
                tooltip: '--gpus= SLURM directive to set the number of GPUs allocated for the job'
              scheduler_directives:
                type: editor
                optional: true
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                optional: true

      num_gpus:
        label: GPUs on this node
        type: number
        default: 1
        min: 1
        tooltip: >
          Number of GPUs to use on the single allocated node. Drives the
          parallelism decision (see the Advanced group for the resolved
          strategy). This pass only exercises single-GPU (strategy=single).

      vram_gb_per_gpu:
        label: VRAM per GPU (GB)
        type: number
        default: 94
        tooltip: >
          Usable HBM per GPU in GB (e.g. H100 NVL = 94, A100 80GB = 80).
          Used together with the model footprint to pick a training strategy.

      # ----------------------------------------------------------------------
      # 2. MODEL PROFILE
      # ----------------------------------------------------------------------
      model_profile:
        label: Model
        type: dropdown
        default: olmo2-1b-dev
        tooltip: Pre-filled profiles carry template + LoRA-target + arch metadata.
        options:
          - { value: olmo2-1b-dev,     label: "OLMo 2 1B (DEV / dense smoke test)" }
          - { value: olmoe-1b-7b-dev,  label: "OLMoE 1B-7B (DEV / MoE smoke test)" }
          - { value: gemma-1.1-7b,     label: "Gemma 1.1 7B IT (dense)" }
          - { value: gemma-4-31b,      label: "Gemma 4 31B IT (dense, multimodal)" }
          - { value: gpt-oss-20b,      label: "gpt-oss-20b (MoE, MXFP4)" }
          - { value: gpt-oss-120b,     label: "gpt-oss-120b (MoE, MXFP4)" }
          - { value: custom,           label: "Custom (enter HF ID below)" }

      base_model_id:
        label: HuggingFace Model ID
        type: string
        default: >-
          ${{ inputs.model_profile == 'olmo2-1b-dev'    ? 'allenai/OLMo-2-0425-1B'
            : inputs.model_profile == 'olmoe-1b-7b-dev'  ? 'allenai/OLMoE-1B-7B-0924-Instruct'
            : inputs.model_profile == 'gemma-1.1-7b'     ? 'google/gemma-1.1-7b-it'
            : inputs.model_profile == 'gemma-4-31b'      ? 'google/gemma-4-31B-it'
            : inputs.model_profile == 'gpt-oss-20b'      ? 'openai/gpt-oss-20b'
            : inputs.model_profile == 'gpt-oss-120b'     ? 'openai/gpt-oss-120b'
            : '' }}
        optional: true
        hidden: ${{ inputs.model_source != 'huggingface' }}
        ignore: ${{ inputs.model_source != 'huggingface' }}
        tooltip: >
          Auto-filled from the profile. For "Custom", paste any HF causal-LM
          ID. Ignored when Model Source is "Local path" below.

      model_source:
        label: Model Source
        type: dropdown
        default: huggingface
        options:
          - { value: huggingface, label: "HuggingFace (downloaded once by the prepare_model job, reused after)" }
          - { value: local,       label: "Local path (pre-staged weights, e.g. a prior run's merged/ output)" }

      local_model_path:
        label: Local Model Path
        type: string
        default: ""
        optional: true
        hidden: ${{ inputs.model_source != 'local' }}
        ignore: ${{ inputs.model_source != 'local' }}
        tooltip: >
          Path to a model directory on the cluster. Also how you fine-tune a
          previously fine-tuned model: point here at a prior run's merged/ output.

      hf_token:
        label: HuggingFace Token
        type: password
        default: ${{ org.HF_TOKEN }}
        optional: true
        hidden: ${{ inputs.model_source != 'huggingface' }}
        ignore: ${{ inputs.model_source != 'huggingface' }}
        tooltip: Needed for gated models (Gemma, etc.). gpt-oss & OLMo are ungated.

      model_cache_dir:
        label: Model Cache Directory
        type: string
        default: ${HOME}/pw/models
        tooltip: >
          Directory to download the model into. The prepare_model job
          downloads it once, as a plain <cache_dir>/<model-name>/ directory
          (config.json, *.safetensors, tokenizer files directly inside it --
          not HuggingFace's hashed hub-cache layout); subsequent runs reuse
          it. Ensure sufficient disk space.
        hidden: ${{ inputs.model_source != 'huggingface' }}
        ignore: ${{ inputs.model_source != 'huggingface' }}

      # ----------------------------------------------------------------------
      # 3. DATASET (on disk)
      # ----------------------------------------------------------------------
      dataset_config:
        type: group
        label: Dataset
        collapsed: false
        items:
          local_dataset_path:
            label: Dataset Path (on cluster)
            type: string
            default: "${PW_PARENT_JOB_DIR}/workflows/finetuning/app/sample-dataset.jsonl"
            optional: false
            tooltip: >
              File on the node -- jsonl/json/csv/parquet/arrow, or an HF
              dataset directory. Defaults to the workflow's bundled 90-row
              example dataset (capital-city Q&A, already formatted with the
              "### Response:" delimiter below) so a first run works out of
              the box and shows the expected row shape -- see README.md
              "Dataset format requirements" before pointing at your own data.
          dataset_format:
            label: Format
            type: dropdown
            default: json
            options:
              - { value: json,    label: "JSON / JSONL" }
              - { value: csv,     label: "CSV" }
              - { value: parquet, label: "Parquet" }
              - { value: arrow,   label: "Arrow" }
              - { value: dataset, label: "HF dataset directory" }
          eval_split_fraction:
            label: Held-out Fraction (eval loss)
            type: number
            default: 0.05
            min: 0
            max: 0.5
            step: 0.01
            tooltip: >
              Fraction reserved as the validation set for held-out loss --
              same loss objective, unseen rows, plotted live next to training
              loss and saved in the offline report. 0 disables held-out loss.
          prompt_field:
            label: Prompt Field
            type: string
            default: prompt
            optional: true

      # ----------------------------------------------------------------------
      # 4. TRAINING HYPERPARAMETERS
      # ----------------------------------------------------------------------
      training:
        type: group
        label: Training Hyperparameters
        collapsed: true
        items:
          num_epochs:            { type: number, label: Epochs,                default: 3.0,    optional: true }
          learning_rate:         { type: number, label: Learning Rate,         default: 0.0002, optional: true }
          micro_batch_size:      { type: number, label: Micro Batch (per GPU), default: 1,       optional: true }
          gradient_accumulation: { type: number, label: Grad Accumulation,     default: 16,      optional: true }
          max_seq_length:        { type: number, label: Max Seq Length,        default: 2048,    optional: true }

      # ----------------------------------------------------------------------
      # 5. LoRA / PEFT
      # ----------------------------------------------------------------------
      lora:
        type: group
        label: LoRA / PEFT
        collapsed: true
        items:
          lora_r:       { type: number, label: LoRA Rank (r), default: 16,   optional: true }
          lora_alpha:   { type: number, label: LoRA Alpha,    default: 16,   optional: true }
          lora_dropout: { type: number, label: LoRA Dropout,  default: 0.05, optional: true }
          quantization:
            label: Quantization
            type: dropdown
            default: auto
            tooltip: >-
              'auto' defers to app/train.py's PROFILE_QUANTIZATION_DEFAULT
              (native for the gpt-oss profiles, 4bit for gemma-4-31b, none
              otherwise). Pick any other value to override it explicitly.
            options:
              - { value: auto,   label: "Auto (per-profile default)" }
              - { value: none,   label: "None (bf16 LoRA)" }
              - { value: 4bit,   label: "4-bit (QLoRA)" }
              - { value: 8bit,   label: "8-bit" }
              - { value: native, label: "Native (MXFP4 as shipped -- gpt-oss; dequantizes to bf16 for training)" }

      # ----------------------------------------------------------------------
      # 6. EVALUATION
      # ----------------------------------------------------------------------
      evaluation:
        type: group
        label: Evaluation
        collapsed: false
        items:
          eval_steps:
            label: Eval-loss Interval (steps)
            type: number
            default: 5
            tooltip: Run held-out loss every N steps (needs eval_split_fraction > 0 above).
          quality_eval_type:
            label: Quality Eval (optional)
            type: dropdown
            default: none
            tooltip: >
              Held-out ANSWER quality, distinct from loss. Not implemented
              this pass (HANDOFF sec5/sec7) -- the selector exists so a future
              evaluator (incl. a refusal check) can plug in without a schema
              change.
            options:
              - { value: none,    label: "None (held-out loss only)" }
              - { value: overlap, label: "Reference overlap (ROUGE/BLEU)" }
              - { value: task,    label: "Task metric (exact-match / accuracy)" }
              - { value: judge,   label: "LLM-as-judge (rubric)" }

      # ----------------------------------------------------------------------
      # 7. DASHBOARD
      # ----------------------------------------------------------------------
      tensorboard_enabled:
        label: Live TensorBoard Dashboard
        type: boolean
        default: true
        tooltip: >
          Serve TensorBoard on the endpoint's port WHILE TRAINING RUNS. Once
          training completes, TensorBoard is stopped and a persistent offline
          report (plots + metrics.json + report.html) is written under
          Output Directory / report -- the endpoint then retires itself.

      # ----------------------------------------------------------------------
      # 8. OUTPUT
      # ----------------------------------------------------------------------
      output_dir:
        label: Output Directory
        type: string
        default: "${HOME}/pw/models/ft-${PW_JOB_ID}"
      merge_full_weights:
        label: Merge LoRA into Full Weights
        type: boolean
        default: true
        tooltip: >
          Produce a standalone merged model dir (vLLM-ready, and reusable as
          a base for another run). For very large MoE (gpt-oss-120b) prefer
          leaving adapters separate (HANDOFF sec8).

      # ----------------------------------------------------------------------
      # 9. CONTAINER SOURCE  (Singularity/.sif -- three mutually-exclusive modes)
      #    One .sif serves all 6 models (HANDOFF sec3.5). Build logic lives in
      #    app/build-container.sh; "build" mode calls that script, never
      #    duplicates it.
      # ----------------------------------------------------------------------
      container:
        type: group
        label: Container (Singularity)
        collapsed: false
        items:
          container_mode:
            label: Container Source
            type: dropdown
            default: sif_path
            tooltip: >
              How to obtain the Singularity image. "Build" runs
              app/build-container.sh on-the-fly on the login node -- slow but
              self-contained.
            options:
              - { value: registry, label: "Pull from registry (ghcr.io, via oras)" }
              - { value: sif_path, label: "Use existing .sif on disk" }
              - { value: build,    label: "Build on-the-fly (calls app/build-container.sh)" }
          container_registry_uri:
            label: Registry URI
            type: string
            default: "ghcr.io/parallelworks/finetune:latest"
            optional: true
            hidden: ${{ inputs.container.container_mode != 'registry' }}
            ignore: ${{ inputs.container.container_mode != 'registry' }}
            tooltip: Pulled via tools/oras/libs.sh:oras_pull_file (anonymous-first, retried).
          container_sif_path:
            label: Existing .sif Path
            type: string
            default: "${HOME}/pw/singularity/finetune.sif"
            optional: true
            hidden: ${{ inputs.container.container_mode != 'sif_path' }}
            ignore: ${{ inputs.container.container_mode != 'sif_path' }}
            tooltip: Absolute path to a prebuilt .sif on the cluster.
          requirements_file:
            label: Pin Set (build mode)
            type: dropdown
            default: requirements.txt
            optional: true
            hidden: ${{ inputs.container.container_mode != 'build' }}
            ignore: ${{ inputs.container.container_mode != 'build' }}
            options:
              - value: requirements.txt
                label: "requirements.txt (transformers 4.x -- default, all profiles except gemma-4-31b)"
              - value: requirements-tf5.txt
                label: "requirements-tf5.txt (transformers 5.x -- REQUIRED for gemma-4-31b only)"
            tooltip: >
              Which pin set app/build-container.sh installs. gemma-4-31b needs
              the 5.x set because no 4.x release recognizes its `gemma4`
              architecture. Do NOT use the 5.x set for MoE profiles or for
              fsdp: both are known-regressed there (see the header of
              app/requirements-tf5.txt). The built image is cached per pin
              set, so switching this rebuilds rather than reusing the other.

      # ----------------------------------------------------------------------
      # 10. ADVANCED (overrides for the resolver / LoRA targets / template)
      # ----------------------------------------------------------------------
      advanced:
        type: group
        label: Advanced
        collapsed: true
        items:
          parallelism_override:
            label: Parallelism Strategy (override)
            type: dropdown
            default: auto
            options:
              - { value: auto,   label: "Auto (resolve from footprint x GPUs)" }
              - { value: single, label: "Single-GPU" }
              - { value: ddp,    label: "DDP (replica per GPU)" }
              - { value: fsdp,   label: "FSDP / ZeRO-3 (shard model) -- not yet implemented, see HANDOFF sec6" }
          lora_targets_override:
            label: LoRA Target Modules (override)
            type: string
            default: ""
            optional: true
            tooltip: >
              Blank = auto-detected by app/train.py from the loaded model
              (dense target list, or gpt-oss-style fused target_parameters
              when the model exposes fused expert Parameter tensors).
          chat_template_override:
            label: Chat Template (override)
            type: string
            default: ""
            optional: true
            tooltip: >
              Blank = profile default (gemma / gemma4 / harmony / olmo).
              Not yet consumed by app/train.py this pass (flat prompt-field
              path only) -- reserved for chat-formatted dataset support.
          response_template:
            label: Response Template (completion-only loss)
            type: string
            default: "### Response:\n"
            optional: true
            tooltip: >
              Delimiter separating prompt from response inside the prompt
              field; matched literally, not as a regex. When set, loss is
              computed on the response ONLY (standard SFT practice). It must
              appear in every row of your dataset -- rows without it are
              dropped with a warning, and a dataset where none match is an
              error. Single-turn data only. Blank = loss over the whole
              sequence, which also trains on the prompt and is not
              recommended. Full rules: the workflow's README.md, "Dataset
              format requirements".
          optim:
            label: Optimizer
            type: dropdown
            default: adamw_torch
            tooltip: >
              adamw_bnb_8bit cuts optimizer-state memory ~4x, which matters
              when many adapters are trained. Avoid the paged_* variants:
              their unified-memory state buffers fail with an illegal memory
              access on some GPUs (observed on a T4).
            options:
              - { value: adamw_torch,       label: "AdamW (torch, default)" }
              - { value: adamw_bnb_8bit,    label: "AdamW 8-bit (bitsandbytes, lower memory)" }
              - { value: adamw_torch_fused, label: "AdamW (torch, fused)" }
          gradient_checkpointing:
            label: Gradient Checkpointing
            type: boolean
            default: false
            tooltip: >
              Trades compute for activation memory. Recommended for the large
              profiles; unnecessary for the 1B/7B dev models.
          bf16:
            label: Use bf16
            type: boolean
            default: false
            tooltip: >
              bf16 instead of fp16 for the compute dtype. Required for the
              gpt-oss profiles (HANDOFF sec3); needs an Ampere-or-newer GPU
              to be fast (it runs, slowly, on older cards).

      service:
        type: group
        label: Service Settings
        collapsed: true
        items:
          name:
            type: string
            hidden: true
            default: finetune
          parent_install_dir:
            type: string
            hidden: true
            default: ${HOME}/pw/software
            tooltip: The finetune container image is stored in this directory. Ensure sufficient space.
