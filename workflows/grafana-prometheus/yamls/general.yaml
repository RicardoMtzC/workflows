# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/grafana-prometheus/app
      - name: Create Inputs
        run: |
          set -x
          # Write PW environment variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          grafana_rundir="${{ inputs.service.rundir }}"
          grafana_retention="${{ inputs.service.retention }}"
          grafana_agent_metrics="${{ inputs.service.agent_metrics }}"
          grafana_extra_targets="${{ inputs.service.extra_targets }}"
          grafana_image="${{ inputs.service.grafana_image }}"
          prometheus_image="${{ inputs.service.prometheus_image }}"
          node_exporter_image="${{ inputs.service.node_exporter_image }}"
          dcgm_exporter_image="${{ inputs.service.dcgm_exporter_image }}"
          grafana_resource_name="${{ inputs.resource.name }}"
          grafana_scheduler="${{ inputs.cluster.scheduler }}"
          pw_endpoints_args="--name ${{ inputs.service.name }}-${PW_RUN_SLUG}"
          EOF
          # Remove empty and undefined variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          # Add export to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Write Password File
        run: |
          # The admin password goes to a mode-600 file Grafana reads, never to
          # inputs.sh or a command line
          umask 077
          cat > grafana-admin-password <<'PASSWORD_EOF'
          ${{ inputs.service.admin_password }}
          PASSWORD_EOF
          truncate -s -1 grafana-admin-password
      - name: Controller Preprocessing
        run: |
          set -x
          # This script prepares the target host and always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/grafana-prometheus/app/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat workflows/grafana-prometheus/app/start-template.sh >> ./start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: ${{ inputs.service.name }}-${PW_RUN_SLUG}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          path: /api/health
          budget: 300
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Service host
        include-workspace: false
        tooltip: Resource to host the service. Docker must be available on the selected host.
      cluster:
        hidden: ${{ inputs.resource.schedulerType == '' }}
        ignore: ${{ inputs.resource.schedulerType == '' }}
        type: group
        label: Compute cluster settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Submit to the scheduler
            description: Otherwise the job runs on the login node.
          slurm:
            type: group
            label: SLURM directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.resource }}
              time:
                label: Walltime
                description: HH:MM:SS, or D-HH:MM:SS for runs over a day.
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                step: 1
                default: 0
                hidden: ${{ inputs.resource.ip != 'dn-slurm-1.parallel.works' }}
                ignore: ${{ .hidden }}
                tooltip: '--gpus= SLURM directive to set the number of GPUs allocated for the job'
              scheduler_directives:
                type: editor
                label: Scheduler directives
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler directives
                type: editor
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1
      service:
        type: group
        label: Grafana settings
        collapsed: true
        items:
          name:
            type: string
            hidden: true
            default: grafana
          rundir:
            label: Run directory
            description: Reuse it to keep the metrics history and the dashboards; only one run at a time can serve it.
            type: string
            default: ${HOME}/grafana-prometheus
            tooltip: |
              Keeps the Prometheus time series (data/prometheus/), Grafana's database with its users, dashboards and settings (data/grafana/) and the generated configuration. Reuse it to keep the metrics history and the dashboards of earlier sessions; only one run at a time can serve it.
          admin_password:
            label: Admin password
            description: Set when the run directory is first initialized; later sessions keep the current one.
            type: password
            default: changeme
            tooltip: |
              Password of Grafana's admin user, set when the run directory is first initialized. Later sessions keep the current password; change it in Grafana. Visitors are signed in anonymously as Admin; the platform login protects the endpoint.
          retention:
            label: Prometheus retention
            description: A number with a unit, such as 15d, 12h or 4w.
            type: string
            default: 15d
            tooltip: |
              How long Prometheus keeps the metrics (--storage.tsdb.retention.time), a number with a unit such as 15d, 12h or 4w.
          agent_metrics:
            label: Platform agent metrics
            description: Only when the service runs on the login node.
            type: boolean
            default: false
            tooltip: |
              Start the platform agent's experimental Prometheus exporter beside the stack (pw agent start-existing --experimental-prometheus-exporter) and scrape it as the pw-agent job: the login node's CPU, memory and storage as the platform agent measures them, which node-exporter already reports in more detail. Only when the service runs on the login node; that agent also listens on an SSH server and proxy port of its own for the life of the stack.
          extra_targets:
            label: Extra scrape targets
            description: One host:port per line.
            type: editor
            optional: true
            tooltip: |
              Additional Prometheus scrape targets, one host:port per line, for exporters already running elsewhere. A service on the host that runs the stack is host.docker.internal:<port> from inside the containers.
          grafana_image:
            label: Grafana image
            description: Pin a tag to lock the version.
            type: string
            default: grafana/grafana:13.2.3
          prometheus_image:
            label: Prometheus image
            description: Pin a tag to lock the version.
            type: string
            default: prom/prometheus:v3.15.0
          node_exporter_image:
            type: string
            hidden: true
            default: prom/node-exporter:v1.12.1
          dcgm_exporter_image:
            type: string
            hidden: true
            default: nvidia/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
