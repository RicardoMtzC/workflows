# One OpenFOAM case of the NACA 4-digit airfoil problem: a structured C-grid is
# generated for the design typed in the form (camber, camber position,
# thickness), the turbulent flow at the given incidence is solved with
# potentialFoam + simpleFoam, serially or decomposed under mpirun, and the lift
# and drag coefficients come back as outputs. The solved case stays in the case
# directory with a case.foam file, so it opens directly in ParaView. Preprocessing
# prepares one sourceable OpenFOAM environment file: the load commands typed in
# the form (module load, source .../bashrc) or, when none are given, the
# conda-forge install made by the app's idempotent installer.
#
# The same YAML is the per-design evaluator of workflows/dakota-openfoam: the
# optimization loop calls it once per proposed design with case.params_file
# pointing at the Dakota-style params file of the case (its values override the
# form's) and case.case_dir at the case directory, so the results land where the
# optimizer reads them.
#
# The HSP (activate.hpc.mil) variant of general.yaml: the same jobs and scripts,
# submitted through the hsp script submitter with its form (SLURM account, QoS and
# node type for on-prem `existing` resources, the PBS account, the DSRC hint). The
# case always takes one node with cores_per_case tasks, so the submitter's nodes
# and cpus_per_task are fixed here instead of asked for. DSRC OpenFOAM modules only
# set foamDotFile: software.openfoam_load there is the module load plus `source
# $foamDotFile`; not every HPCMP login node reaches the internet for the
# conda-forge install (Nautilus does).
#
# With postprocessing.generate_images, the case ends by rendering its fields to
# PNG images with ParaView's pvpython (render-images.sh + render-case.py in the
# app): pressure, velocity, streamlines, eddy viscosity, the wake and the mesh,
# labeled with the design and its coefficients. ParaView comes from the form's
# load commands or, when none are given, from the official binaries the app's
# installer downloads once; a case whose images fail to render is still a solved
# case (the coefficients are on disk first).
#
# Checkpoints and resuming (the restart group): the solver can write its fields
# every N iterations and, with resume on, a case found in the case directory
# that was built from the same design and settings is continued instead of
# started over: the mesh, the decomposition and the potentialFoam initialization
# are kept once done, simpleFoam restarts from its latest complete checkpoint,
# and a solved case, or one whose solver failed on its own, is not solved again.
# Every attempt is one line of <case directory>/attempts.log (app/restart.sh).
# The group is hidden: hsp-restart.yaml sets it when it calls this YAML from a
# retried step until the case completes, with restart.attempt on, which makes a
# case that failed on its own complete the run (final, so the loop stops) instead
# of failing it (interrupted, so the loop resumes it); a caller's with: block can
# set it too.
permissions:
  - '*'

# Saved inputs, offered under "Load saved inputs" on the Execute page: the OpenFOAM
# environment of Nautilus (Navy DSRC), whose openfoam module loads the compilers
# and OpenMPI 5 and only points at OpenFOAM through foamDotFile, asking for the source
configurations:
  nautilus_modules:
    inputs:
      software:
        openfoam_load: |
          module load openfoam/Intel/v2512
          source $foamDotFile

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout OpenFOAM NACA App
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/openfoam-naca/app
            - tools/utils
      # the environment is one file every later step and the case source
      # (app/prepare-environments.sh); the quoted heredocs carry the form's load
      # commands verbatim (empty -> the installers)
      - name: Prepare the OpenFOAM and ParaView Environments
        run: |
          cat > openfoam-load.sh << 'PW_LOAD_EOF'
          ${{ inputs.software.openfoam_load }}
          PW_LOAD_EOF
          cat > paraview-load.sh << 'PW_LOAD_EOF'
          ${{ inputs.software.paraview_load }}
          PW_LOAD_EOF
          CORES_PER_CASE="${{ inputs.cluster.cores_per_case }}" GENERATE_IMAGES="${{ inputs.postprocessing.generate_images }}" \
            RESOURCE_IP="${{ inputs.resource.ip }}" \
            bash workflows/openfoam-naca/app/prepare-environments.sh openfoam-load.sh paraview-load.sh
      # the case directory gets the design (params.in) and the script the submitter
      # runs there (app/create-case.sh, one script shared by every variant)
      - name: Create the Case
        run: |
          CASE_DIR="${{ inputs.case.case_dir }}" PARAMS_FILE="${{ inputs.case.params_file }}" \
            MAX_CAMBER="${{ inputs.case.max_camber }}" CAMBER_POSITION="${{ inputs.case.camber_position }}" \
            THICKNESS="${{ inputs.case.thickness }}" ANGLE_OF_ATTACK="${{ inputs.case.angle_of_attack }}" \
            MESH_SCALE="${{ inputs.case.mesh_scale }}" CORES_PER_CASE="${{ inputs.cluster.cores_per_case }}" \
            RESUME="${{ inputs.restart.resume }}" CHECKPOINT_EVERY="${{ inputs.restart.checkpoint_every }}" \
            KEEP_CHECKPOINTS="${{ inputs.restart.keep_checkpoints }}" GENERATE_IMAGES="${{ inputs.postprocessing.generate_images }}" \
            OUTPUTS="${OUTPUTS}" bash workflows/openfoam-naca/app/create-case.sh

  run_case:
    needs: [preprocessing]
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Run OpenFOAM
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/script_submitter/v3.6/hsp.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          # the submitter cds into the case dir, so case.sh's relative paths resolve there
          rundir: ${{ needs.preprocessing.outputs.CASE_DIR }}
          use_existing_script: true
          script_path: ./case.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            account: ${{ inputs.cluster.slurm.account }}
            partition: ${{ inputs.cluster.slurm.partition }}
            qos: ${{ inputs.cluster.slurm.qos }}
            # one node per case with one CPU per rank, fixed rather than asked for:
            # on `existing` resources the hsp submitter writes these two before
            # the directives below, whose --ntasks then sets the rank count
            cpus_per_task: 1
            nodes: 1
            node_type: ${{ inputs.cluster.slurm.node_type }}
            time: ${{ inputs.cluster.slurm.time }}
            # the case's core request goes first so a directive typed in the form
            # can still override it: sbatch and qsub keep the last value of a
            # repeated option. One node per case: mpirun launches its ranks locally.
            scheduler_directives: |
              #SBATCH --nodes=1
              #SBATCH --ntasks=${{ inputs.cluster.cores_per_case }}
              ${{ inputs.cluster.slurm.scheduler_directives }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            account: ${{ inputs.cluster.pbs.account }}
            scheduler_directives: |
              #PBS -l select=1:ncpus=${{ inputs.cluster.cores_per_case }}:mpiprocs=${{ inputs.cluster.cores_per_case }}
              ${{ inputs.cluster.pbs.scheduler_directives }}

  # the submitter never forwards the script's exit status, so the verdict comes
  # from the files the case left behind: results.out (the objectives) or none.
  # The step is one script shared by every variant (app/read-results.sh)
  results:
    needs: [preprocessing, run_case]
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Read the Coefficients
        run: |
          OUTPUTS="${OUTPUTS}" GENERATE_IMAGES="${{ inputs.postprocessing.generate_images }}" \
            MESH_SCALE="${{ inputs.case.mesh_scale }}" RESTART_ATTEMPT="${{ inputs.restart.attempt }}" \
            bash workflows/openfoam-naca/app/read-results.sh "${{ needs.preprocessing.outputs.CASE_DIR }}"

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Compute resource
        include-workspace: false
        tooltip: Resource where the OpenFOAM case runs
      cluster:
        type: group
        label: Compute Cluster Settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Schedule the Case?
            hidden: ${{ inputs.resource.schedulerType == '' }}
            ignore: ${{ .hidden }}
            tooltip: |
              Yes → The case is submitted to the scheduler using sbatch, qsub, etc
              No  → The case runs on the controller or login node instead
          cores_per_case:
            type: number
            label: Cores per case
            default: 1
            min: 1
            max: 64
            tooltip: |
              MPI ranks for the case. 1 runs the solvers serially; more decomposes
              the mesh into N strips and runs potentialFoam and simpleFoam under
              mpirun, then reconstructs the result. Only pays off from mesh_scale
              3-4 (2-4 ranks): at the default mesh a decomposed case is slower
              than a serial one. The solver caps the ranks at one per 1000 cells
              (the mesh has 5400 x mesh_scale^2 cells, so 16 ranks need mesh_scale
              2 or more): 16 ranks on the base mesh diverged where 4 converged. A
              scheduled case requests --nodes=1 --ntasks=N (PBS:
              select=1:ncpus=N:mpiprocs=N), so N must fit one node.
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              account:
                label: SLURM account
                type: slurm-accounts
                resource: ${{ inputs.resource }}
                tooltip: '--account=value slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider }}
                hidden: ${{ .ignore }}
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.resource }}
                tooltip: Select a partition from the drop down menu.
              qos:
                label: Quality of Service [QoS]
                type: slurm-qos
                resource: ${{ inputs.resource }}
                tooltip: '--qos=value slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider }}
                hidden: ${{ .ignore }}
              node_type:
                label: Node Type
                type: dropdown
                optional: true
                default: ''
                option-key: ${{ inputs.resource.ip }}
                tooltip: '--constraint=<value> slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider || (inputs.resource.ip != 'blueback.navydsrc.hpc.mil' && inputs.resource.ip != 'narwhal.navydsrc.hpc.mil' && inputs.resource.ip != 'nautilus.navydsrc.hpc.mil' && inputs.resource.ip != 'raider.afrl.hpc.mil' && inputs.resource.ip != 'crux.mhpcc.hpc.mil') }}
                hidden: ${{ .ignore }}
                options:
                  blueback.navydsrc.hpc.mil:
                    - standard
                    - bigmem
                    - mla
                    - viz
                    - transfer
                  narwhal.navydsrc.hpc.mil:
                    - standard
                    - bigmem
                    - mla
                    - smla
                    - dmla
                    - viz
                    - transfer
                  nautilus.navydsrc.hpc.mil:
                    - standard
                    - highclock
                    - bigmem
                    - mla
                    - viz
                    - transfer
                  raider.afrl.hpc.mil:
                    - standard
                    - highclock
                    - bigmem
                    - mla
                    - viz
                    - transfer
                  crux.mhpcc.hpc.mil:
                    - AMD
                    - Intel
              time:
                label: Walltime
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the case (format: D-HH:MM:SS or HH:MM:SS, e.g. 7-00:00:00 or 01:00:00)'
              scheduler_directives:
                type: editor
                optional: true
                default: |
                  ##SBATCH --constraint=mla # uncomment for Navy and AFRL DSRC systems
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
                  The workflow already sets --nodes=1 and --ntasks from Cores per case;
                  a directive here repeating one of them takes precedence.
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              account:
                label: Account
                type: string
                tooltip: PBS account for job submission (-A)
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                default: |
                  # Parameters that apply to all sites
                  #PBS -l walltime=01:00:00
                  #PBS -V
                  #PBS -q standard
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1
                  The workflow already sets -l select=1:ncpus=N:mpiprocs=N from Cores per case;
                  a directive here repeating it takes precedence.
      case:
        type: group
        label: Airfoil Case
        items:
          max_camber:
            type: number
            label: Maximum camber (chord fraction)
            default: 0.02
            min: 0
            max: 0.06
            tooltip: |
              The first NACA digit / 100: 0 is a symmetric airfoil (00xx), 0.02 a
              2412-like one. The box 0-0.06 is where the C-grid generator was
              validated; higher forward camber breaks the mesh quality.
          camber_position:
            type: number
            label: Camber position (chord fraction)
            default: 0.4
            min: 0.3
            max: 0.6
            tooltip: The second NACA digit / 10. Ignored by the geometry when the camber is 0.
          thickness:
            type: number
            label: Thickness (chord fraction)
            default: 0.12
            min: 0.08
            max: 0.18
            tooltip: The last two NACA digits / 100.
          angle_of_attack:
            type: number
            label: Angle of attack (degrees)
            default: 5
            min: -5
            max: 12
            tooltip: |
              Incidence of the freestream. The airfoil stays axis-aligned; the
              angle goes into the far-field velocity and the lift/drag directions.
          mesh_scale:
            type: number
            label: Mesh resolution multiplier
            default: 1
            min: 1
            max: 6
            tooltip: |
              The cost dial: multiplies every cell count of the C-grid around the
              airfoil, and the solver's iteration budget scales with it, so cost
              grows roughly with the cube: ~10 s per case at 1, ~1 min at 2,
              ~10 min at 4, ~35 min at 6 (one core). The mesh is essentially
              converged by 3-4; the README has the measured accuracy table.
          case_dir:
            type: string
            label: Case directory
            optional: true
            tooltip: |
              Absolute path where the case is built and solved. Leave empty for
              case/ under this run's job directory. An optimization loop passes
              the case directory it proposed, so the results land where the
              optimizer reads them.
          params_file:
            type: string
            label: Design from a params file
            optional: true
            default: ''
            tooltip: |
              Absolute path of a Dakota-style parameters file, one "<value> <name>"
              line per entry. Its values override the form fields of the same
              name (max_camber, camber_position, thickness, angle_of_attack); a
              field the file does not list keeps the form's value, so the file
              need not carry them all. Any other name, or a value that is not a
              number, fails the case. An optimization loop passes the file of
              the design it proposed here.
      postprocessing:
        type: group
        label: Postprocessing
        items:
          generate_images:
            type: boolean
            label: Generate images of the results?
            default: false
            tooltip: |
              Yes → once the solver has converged, ParaView renders the fields of
              the case to PNG images in <case directory>/images: pressure, velocity
              magnitude, streamlines, eddy viscosity, the wake and the mesh, each
              labeled with the design and its coefficients. ParaView comes from
              the commands in Software Environment or, left empty, from the
              official binaries the workflow downloads once (no sudo, ~830 MB).
              A case whose images fail to render still reports its coefficients.
      restart:
        type: group
        label: Checkpoints and Resume (hidden; set by hsp-restart.yaml and by callers)
        hidden: true
        items:
          checkpoint_every:
            type: number
            label: Write the fields every N iterations
            default: 0
            min: 0
            tooltip: |
              0 writes only the last iteration. N > 0 also writes every N
              iterations: the checkpoints a resumed case restarts from, and
              intermediate fields to look at in ParaView. The last Checkpoints
              kept of them stay on disk (purgeWrite).
          keep_checkpoints:
            type: number
            label: Checkpoints kept
            default: 2
            min: 1
            tooltip: |
              How many written iterations stay on disk; older ones are removed as
              new ones are written. Keep at least two to resume: a checkpoint a
              kill cut short is incomplete and discarded, and the solver restarts
              from the one before it.
          resume:
            type: boolean
            label: Resume the case in the case directory?
            default: false
            tooltip: |
              No  → case/ under the case directory is removed and the case solved
                    from scratch.
              Yes → a case/ built from the same design and settings (listed in
                    case/restart/inputs) is continued: the mesh, the decomposition
                    and the potentialFoam initialization are kept once done,
                    simpleFoam restarts from its latest complete checkpoint, a
                    solved case is not solved again and neither is one whose
                    solver failed on its own (diverged). A case built from other
                    inputs starts from scratch. Every attempt is one line of
                    <case directory>/attempts.log. This is what
                    hsp-restart.yaml relies on to resubmit a case until it
                    completes.
          attempt:
            type: boolean
            hidden: true
            default: false
            label: One attempt of a resubmission loop? Yes only from hsp-restart.yaml's retried step, where a case that failed on its own completes the run so the loop stops
      software:
        type: group
        label: Software Environment
        collapsed: true
        items:
          openfoam_load:
            type: editor
            label: OpenFOAM environment commands
            optional: true
            tooltip: |
              Shell commands that put blockMesh, potentialFoam and simpleFoam (and
              decomposePar, reconstructPar plus mpirun when Cores per case > 1) on
              PATH, one per line, e.g. `module load openfoam/2412` or `source
              /opt/openfoam2412/etc/bashrc`. DSRC openfoam modules only set
              foamDotFile: give `module load openfoam/Intel/v2512` and `source
              $foamDotFile` on two lines (Nautilus). Left empty, the workflow
              installs OpenFOAM v2412 from conda-forge (no sudo, ~5 min once) under
              ${service_parent_install_dir:-$HOME/pw/software}/openfoam-naca, which
              only works where the login node reaches the internet (Nautilus does;
              not every HPCMP system does).
              The case sources these commands; `export MPIRUN="srun --mpi=pmix"`
              here replaces the default launcher `mpirun --bind-to none -np N`.
          paraview_load:
            type: editor
            label: ParaView environment commands
            optional: true
            hidden: ${{ inputs.postprocessing.generate_images == false }}
            ignore: ${{ .hidden }}
            tooltip: |
              Shell commands that put pvpython on PATH, one per line, e.g.
              `module load paraview/5.13`. Leave empty to download the official
              ParaView 6.1.1 Linux binaries (x86_64, no sudo, ~830 MB once, 2.7 GB
              on disk) under
              ${service_parent_install_dir:-$HOME/pw/software}/openfoam-naca/paraview;
              they render without a display. A site build that needs an X server
              is run under xvfb-run where that exists. Needs ParaView 5.10 or newer.
