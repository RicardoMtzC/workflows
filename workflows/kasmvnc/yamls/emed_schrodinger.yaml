# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Checkout ${{ inputs.container_runtime }}
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/kasmvnc/${{ inputs.container_runtime }}
            - tools/oras
      - name: Create Inputs
        run: |
          set -x
          if [ -z "${PW_PLATFORM_HOST}" ]; then
            echo "::warning::PW_PLATFORM_HOST is unset; defaulting to cluster.einsteinmed.edu"
            PW_PLATFORM_HOST=cluster.einsteinmed.edu
          fi
          PW_PLATFORM_HOST="${PW_PLATFORM_HOST#https://}"
          # Write PW variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Password (vestigial: the container disables VNC auth, but the viewer
          # accepts it in the URL, so keep v4 parity)
          password=$(openssl rand -base64 12 | head -c 12)
          # This platform has no session subdomains, so the endpoint is path-based
          # (--no-subdomain) and the platform forwards requests with the full
          # /me/session/<user>/<name>/ prefix. The container's nginx must serve
          # under that prefix, and the noVNC client needs host+prefix to open its
          # websocket there instead of at the platform root.
          endpoint_name=kasmvnc-${PW_RUN_SLUG}
          basepath=/me/session/${PW_USER}/${endpoint_name}
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          kasmvnc_os="${{ inputs.desktop.kasmvnc_os }}"
          service_load_env="${{ inputs.desktop.load_env }}"
          service_bin="${{ inputs.desktop.bin }}"
          container_mount_paths="${{ inputs.desktop.container_mount_paths }}"
          pw_endpoints_args="--no-subdomain"
          EOF
          echo basepath=${basepath} >> inputs.sh
          echo password=${password} >> inputs.sh
          echo "endpoint_name=${endpoint_name}" >> inputs.sh
          echo "endpoint_slug=\"vnc.html?resize=remote&autoconnect=true&show_dot=true&path=websockify&password=${password}&host=${PW_PLATFORM_HOST}${basepath}/&dt=0\"" >> inputs.sh
          # Remove empty variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh # remove var=""
          # Prepend 'export ' to each VAR= assignment line only -- NOT to the
          # continuation lines of a multi-line value. container_mount_paths is an
          # 'editor' input written one path per line; a blanket 's/^/export /' would
          # turn each extra path into 'export /path' and corrupt inputs.sh.
          sed -i -E 's/^([A-Za-z_][A-Za-z0-9_]*=)/export \1/' inputs.sh
      - name: Set Up Install Parent Directory
        run: |
          set -x
          # emed clusters share installed software under /public/codelab -- the
          # emed counterpart of hsp's ${PROJECTS_HOME}/hsp (jupyter and
          # jupyterlab keep their installs under the user's home instead). Fall
          # back to the home default when the directory is absent (a non-emed
          # cluster); the controller and start scripts additionally fall back
          # per artifact when it is not writable and the artifact is not
          # already cached in it.
          if [ -d /public/codelab ]; then
            emed_install_dir=/public/codelab
          else
            echo "::warning title=Install Directory::/public/codelab not found - falling back to ${HOME}/pw/software"
            emed_install_dir=${HOME}/pw/software
          fi
          echo "::notice title=Install Directory::Using Install Directory: ${emed_install_dir}"
          echo "export service_parent_install_dir=${emed_install_dir}" >> inputs.sh
      - name: Controller Preprocessing
        run: |
          set -x
          # This script prepares the target host and always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/kasmvnc/${{ inputs.container_runtime }}/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat workflows/kasmvnc/${{ inputs.container_runtime }}/start-template.sh >> ./start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/emed.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            slurm_options: ${{ inputs.cluster.slurm.slurm_options }}
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition_default: ${{ inputs.cluster.slurm.partition_default }}
            partition_hpc4: ${{ inputs.cluster.slurm.partition_hpc4 }}
            cpus_per_task: ${{ inputs.cluster.slurm.cpus_per_task }}
            mem: ${{ inputs.cluster.slurm.mem }}
            gres_gpu_default: ${{ inputs.cluster.slurm.gres_gpu_default }}
            gres_gpu_hpc4: ${{ inputs.cluster.slurm.gres_gpu_hpc4 }}
            time: ${{ inputs.cluster.slurm.time }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
        cleanup: |
          set -x
          if [ -d tools/oras ]; then
            echo "Removing tools/oras"
            rm -rf tools/oras
          fi
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: kasmvnc-${PW_RUN_SLUG}
          host: ${{ inputs.cluster.resource.ip }}
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

'on':
  execute:
    inputs:
      container_runtime:
        type: string
        hidden: true
        default: kasmvnc-singularity
      cluster:
        type: group
        label: Compute Cluster Settings
        items:
          resource:
            type: compute-clusters
            label: Service host
            include-workspace: false
            tooltip: Resource to host the service
            autoselect: true
          scheduler:
            type: boolean
            default: true
            label: Schedule Job?
            hidden: true
            tooltip: |
              Yes → Job is submitted to the scheduler using sbatch, qsub, etc
              No  → Job is executed in the controller or login node instead
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              slurm_options:
                type: dropdown
                label: Select Cluster
                optional: true
                default: ''
                options:
                  - value: ''
                    label: Default
                  - value: 'hpc4'
                    label: HPC4
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM Enabled? Yes, unless the slurm section is hidden and ignored
              partition_default:
                type: slurm-partitions
                label: SLURM partition
                ignore: ${{ 'hpc4' == inputs.cluster.slurm.slurm_options }}
                hidden: ${{ .ignore }}
                optional: true
                resource: ${{ inputs.cluster.resource }}
                tooltip: Select a partition from the drop down menu. Leave empty to let SLURM pick a partition.
              partition_hpc4:
                type: dropdown
                label: SLURM partition
                optional: true
                tooltip: Select a partition from the drop down menu. Leave empty to let SLURM pick a partition.
                ignore: ${{ 'hpc4' != inputs.cluster.slurm.slurm_options }}
                hidden: ${{ .ignore }}
                default: normal
                options:
                  - normal
                  - gpu
                  - gpu-h200
                  - gpu-quick
                  - ht
                  - large-mem
                  - quick
                  - test
                  - test-rhel9
                  - unlimited
              cpus_per_task:
                type: number
                label: CPUs per task
                min: 1
                max: 32
                default: 1
                tooltip: '--cpus-per-task=value slurm directive'
                ignore: ${{ ('existing' != inputs.cluster.resource.provider && 'managed-cluster' != inputs.cluster.resource.provider) }}
                hidden: ${{ .ignore }}
              mem:
                type: dropdown
                label: Minimum total memory required
                default: 8GB
                tooltip: '--mem=value slurm directive'
                hidden: ${{ ('existing' != inputs.cluster.resource.provider && 'managed-cluster' != inputs.cluster.resource.provider) }}
                ignore: ${{ .hidden }}
                options:
                   - 8GB
                   - 16GB
                   - 32GB
                   - 64GB
                   - 128GB
                   - 256GB
                   - 512GB
              gres_gpu_default:
                type: number
                label: Number of GPUs
                ignore: ${{ ( inputs.cluster.slurm.partition_default != 'gpu' && inputs.cluster.slurm.partition_default != 'gpu-quick' ) || ('existing' != inputs.cluster.resource.provider && 'managed-cluster' != inputs.cluster.resource.provider)  }}
                hidden: ${{ .ignore }}
                min: 1
                max: 4
                default: 1
                tooltip: '--gres=gpu:X slurm directive'
              gres_gpu_hpc4:
                type: number
                label: Number of GPUs
                hidden: ${{ ( inputs.cluster.slurm.partition_hpc4 != 'gpu' && inputs.cluster.slurm.partition_hpc4 != 'gpu-quick' && inputs.cluster.slurm.partition_hpc4 != 'gpu-h200' ) || ('existing' != inputs.cluster.resource.provider && 'managed-cluster' != inputs.cluster.resource.provider)  }}
                ignore: ${{ .hidden }}
                optional: ${{ .hidden }}
                min: 1
                max: 4
                default: 1
                tooltip: '--gres=gpu:X slurm directive'
              time:
                label: Walltime
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              scheduler_directives:
                type: editor
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1

      desktop:
        type: group
        label: Desktop Settings
        collapsed: true
        items:
          kasmvnc_os:
            type: dropdown
            label: Operating System
            hidden: true
            default: rocky9
            tooltip: Choose the operating system for the KasmVNC container
            options:
              - label: Rocky Linux 9
                value: rocky9
          load_env:
            label: Command to load Schrodinger
            type: string
            default: module load schrodinger
            tooltip: Runs on the compute node before launching Schrodinger on the desktop's display
          bin:
            label: Service Binary
            type: string
            hidden: true
            default: maestro
          container_mount_paths:
            type: editor
            label: Additional Mount Paths
            optional: true
            tooltip: |
              Extra directories to bind-mount into the container, one per line.
              Each path is mounted if it exists on the host; if it does not, a warning is logged and the path is skipped.
              Your home directory and /scratch are mounted automatically when present.
