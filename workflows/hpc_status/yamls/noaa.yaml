# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/hpc_status/app
      - name: Create Inputs
        run: |
          set -x
          # Write PW variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          service_parent_install_dir="${{ inputs.service.parent_install_dir }}"
          service_platform="${{ inputs.platform }}"
          service_subdomain="${{ inputs.service.subdomain }}"
          service_local_port="${{ inputs.service.port }}"
          service_detach="${{ inputs.service.detach }}"
          service_theme="${{ inputs.service.theme }}"
          service_enable_cluster_pages="${{ inputs.service.enable_cluster_pages }}"
          service_enable_cluster_monitor="${{ inputs.service.enable_cluster_monitor }}"
          service_cluster_monitor_interval="${{ inputs.service.cluster_monitor_interval }}"
          service_sweep_concurrency="${{ inputs.service.sweep_concurrency }}"
          service_pw_context="${{ inputs.service.pw_context }}"
          service_endpoint_name="$(printf '%s' '${{ inputs.service.name }}' | sed 's/^undefined$//' | tr 'A-Z' 'a-z' | tr -c 'a-z0-9-' '-' | sed 's/--*/-/g; s/^-//; s/-$//')"
          pw_endpoints_args="--name ${service_endpoint_name:-rdhpcs-status}"
          EOF
          # Remove empty variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh # remove var=""
          # Add export= to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Set Up Install Parent Directory
        run: |
          source inputs.sh
          set -x
          # NOAA home directories are small and this workflow builds a virtualenv there
          # (plus a standalone python when the system one is too old for the dashboard), so
          # it installs into the cluster's shared software directory when this account can
          # write there. A read-only shared copy is no use: the controller rebuilds the
          # virtualenv whenever it does not import, so it needs write access to the tree
          # it uses. Probe by creating the directory rather than reading the mode bits -
          # the shared trees are group- or ACL-writable and list as root-owned.
          if [ -n "${service_parent_install_dir}" ]; then
            echo "::notice title=Install Directory::Using Install Directory from the input form: ${service_parent_install_dir}"
          else
            case "${{ inputs.cluster.resource.ip }}" in
              hfe[0-9]*.fairmont.rdhpcs.noaa.gov) shared=/contrib/pw ;;          # Hera
              mfe[0-9]*.fairmont.rdhpcs.noaa.gov) shared=/contrib/pw ;;          # Mercury
              ufe[0-9]*.fairmont.rdhpcs.noaa.gov) shared=/contrib/pw ;;          # Ursa
              gaea[0-9]*.ncrc.gov) shared=/usw/rdhpcs/software/pw ;;             # Gaea
              *) shared="" ;;                                                    # workspace, PPAN, cloud clusters
            esac
            install_dir="${HOME}/pw/software"
            if [ -n "${shared}" ] && mkdir -p "${shared}/hpc_status" 2>/dev/null; then
              install_dir="${shared}"
            fi
            echo "::notice title=Install Directory::Using Install Directory: ${install_dir}"
            echo "export service_parent_install_dir=\"${install_dir}\"" >> inputs.sh
          fi
      - name: Controller Preprocessing
        run: |
          set -x
          # This script prepares the target host and always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/hpc_status/app/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat workflows/hpc_status/app/start-template.sh >> ./start-service-${PW_JOB_ID}.sh
          source inputs.sh
          echo "ENDPOINT_NAME=${pw_endpoints_args#--name }" | tee -a $OUTPUTS
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS
          # Kept serving, the healthy dashboard outlives the run through the submitter's
          # skip file. Otherwise the run stays open while it serves and cancelling the run
          # is its teardown, so the wait marks a file the submitter does not read
          if [ "${{ inputs.service.detach }}" = "false" ]; then
            echo "HEALTHY_MARKER_PATH=${PWD}/SERVING" | tee -a $OUTPUTS
          else
            echo "HEALTHY_MARKER_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS
          fi

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/noaa.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: false
          # The dashboard always runs where preprocessing did: it needs the pw CLI, its
          # credentials and internet access for as long as it serves, and a scheduler
          # allocation would end under it at its walltime
          scheduler: false
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: false
          pbs:
            is_enabled: false
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow
        run: |
          if [ "${{ inputs.service.detach }}" = "false" ] && [ -f "${{ needs.preprocessing.outputs.HEALTHY_MARKER_PATH }}" ]; then
            echo "::notice::The dashboard stopped serving"
            exit 0
          fi
          echo "::error title=Error::The dashboard exited before its endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: ${{ needs.preprocessing.outputs.ENDPOINT_NAME }}
          host: ${{ inputs.cluster.resource.ip }}
          skip_cleanups_file: ${{ needs.preprocessing.outputs.HEALTHY_MARKER_PATH }}
          # A first start has no cached fleet and answers only after one full sweep:
          # a pw ssh round trip to every cluster, or the HPCMP status pages
          budget: 900
      - name: Cancel Script Submitter
        if: ${{ inputs.service.detach != false }}
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

  summary:
    needs:
      - preprocessing
      - wait_for_endpoint
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Summary
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          endpoint_name="${{ needs.preprocessing.outputs.ENDPOINT_NAME }}"
          url=$(pw endpoints list | awk -F'\t' -v name="${endpoint_name}" '$1 == name {print $3}')
          echo "::notice::Dashboard: ${url:-endpoint ${endpoint_name} (see pw endpoints list)}"
          if [ "${{ inputs.service.detach }}" = "false" ]; then
            echo "The dashboard serves for as long as this run stays open; cancel the run, or delete its session, to stop it."
          else
            echo "The dashboard keeps serving after this run completes; stop it by deleting its session:"
            echo "  pw endpoints delete ${endpoint_name}"
          fi

'on':
  execute:
    inputs:
      platform:
        type: dropdown
        label: Platform
        default: noaa
        hidden: true
        tooltip: Select the deployment platform configuration
        options:
          - label: Generic
            value: generic
          - label: HPCMP
            value: hpcmp
          - label: NOAA
            value: noaa
      service:
        type: group
        label: Settings
        collapsed: true
        items:
          name:
            type: string
            label: Endpoint name
            description: A launch replaces the dashboard already running under this name.
            default: rdhpcs-status
            tooltip: >-
              Name of the endpoint session, shown in your sessions list. A launch
              replaces the dashboard already running under this name. Lowercase
              letters, digits and dashes; anything else becomes a dash.
          detach:
            type: boolean
            label: Keep serving after the run ends
            description: Off, cancelling the run stops the dashboard.
            default: true
            tooltip: >-
              On, the run finishes once the dashboard answers and the dashboard keeps
              serving on a credential that outlives the run; stop it by deleting the
              session. Off, the run stays open for as long as the dashboard does and
              cancelling it stops everything.
          subdomain:
            type: string
            label: Public subdomain
            description: Blank derives status-<username>.
            optional: true
            default: ""
            tooltip: >-
              Hostname label for the dashboard, so the URL stays the same
              between runs. Blank derives status-<username>. Reserve it
              with `pw subdomains reserve <name>` to keep it yours.
          sweep_concurrency:
            type: number
            step: 1
            label: Clusters swept at once
            default: 6
            min: 1
            tooltip: >-
              Advanced. How many clusters the monitor collects from
              simultaneously. Each cluster is still handled one connection
              at a time, so this only overlaps different systems — raise it
              for a faster sweep of a large fleet, lower it to be gentler.
          port:
            type: number
            step: 1
            label: Local port
            description: 0 lets the CLI pick a free port.
            default: 0
            min: 0
            tooltip: >-
              Local port the dashboard binds on the node. Leave at 0 to let
              the CLI pick a free one — set it only if you need a
              predictable port, and note that 8080 is already Grafana.
          theme:
            type: dropdown
            label: UI theme
            default: light
            options:
              - label: Dark
                value: dark
              - label: Light
                value: light
          enable_cluster_pages:
            type: boolean
            label: Enable cluster pages
            default: true
            tooltip: Enable queue and quota monitoring pages
          enable_cluster_monitor:
            type: boolean
            label: Enable cluster monitor
            default: true
            tooltip: Enable background cluster data collection
          cluster_monitor_interval:
            type: number
            step: 1
            label: Refresh interval
            description: In seconds, at least 60; 180 recommended on NOAA.
            default: 180
            min: 60
          parent_install_dir:
            label: Parent install directory
            type: string
            hidden: true
            optional: true
            tooltip: |
              The dashboard's Python environment is installed under this directory on the
              dashboard host. Leave empty to use the cluster's shared software directory
              when this account can write to it, and ${HOME}/pw/software otherwise.
          pw_context:
            type: string
            hidden: true
            default: noaa
            tooltip: >-
              Identity every pw call is pinned to, so the dashboard queries NOAA clusters
              whatever context the host's saved credentials are on
      cluster:
        type: group
        label: Where to run
        collapsed: true
        items:
          resource:
            type: compute-clusters
            label: Dashboard host
            description: The user workspace needs no setup and is what you want unless you have a reason not to.
            include-workspace: true
            default: workspace
            tooltip: >-
              Advanced. The user workspace needs no setup and is what you want
              unless you have a reason not to. Pick a cluster to keep the dashboard
              serving when the workspace recycles — that host needs the pw CLI on
              its PATH and authenticated (pw auth there), and the run says so
              plainly if it does not.
