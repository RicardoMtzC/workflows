# Spack MPI Stack Builder — general variant (standard cloud/on-prem SLURM & PBS).
#
# Builds GCC + OpenMPI + MPICH + Intel MPI + GROMACS (per MPI) + OSU (per MPI),
# with an optional GPU path, and publishes everything to a binary build cache.
#
# This is a BUILD workflow, not an endpoint service: it runs to completion and
# exits. The pw endpoint it registers at the end serves an empty page and exists
# only to satisfy the shared end-to-end test runner (README.md).
#
# Flow:
#   preprocess -> checkout app/, write inputs.sh, bootstrap Spack + build cache
#                 (controller.sh), decide overrides vs detection, assemble the
#                 two submitted scripts
#   detect     -> script_submitter, scheduler=true: runs on a WORKER node and
#                 reports its fabric, GPU and microarchitecture into fabric.env
#   build      -> script_submitter, scheduler=false: runs on the LOGIN node,
#                 which has internet for source fetches and no queue walltime
#   verify     -> turn a failed build into a failed run
#   endpoint   -> a placeholder pw endpoint, and wait_for_endpoint to release the
#                 run once it is up. The build needs neither; they exist so the
#                 shared end-to-end test runner, which demands an endpoint, can
#                 test this workflow at all. See README.md.
#
# Why detection and the build run in different places: the login node is
# routinely a different instance type from the compute nodes, so the stack has to
# be described by the workers but is cheapest to compile on the login node.
# build.sh reconciles the two (see app/resolve-target.py) and says out loud when
# the login node cannot emit the workers' target.
#
# Override policy: target, fabric and cuda-arch are all-or-nothing. When all
# three are set, detection is skipped entirely and no worker is allocated.

permissions: ['*']

'on':
  execute:
    inputs:
      $meta:
        labelPosition: top

      cluster_header:
        type: header
        text: Target Cluster
        size: 18

      cluster:
        type: group
        label: Compute Cluster Settings
        items:
          resource:
            type: compute-clusters
            label: Compute cluster
            include-workspace: false
            optional: false
            tooltip: >-
              The cluster to build on. The compile runs on this resource's login
              node; a worker is allocated only to inspect the compute hardware.
          scheduler:
            type: boolean
            default: true
            label: Inspect a compute node?
            hidden: ${{ inputs.cluster.resource.schedulerType == '' }}
            ignore: ${{ .hidden }}
            tooltip: |
              Yes → a short job runs on a WORKER to report its fabric, GPU and CPU
                    microarchitecture, so the stack is built for the right hardware.
              No  → inspect the login node instead. Only correct when the login and
                    compute nodes are the same instance type.
          slurm:
            type: group
            label: SLURM Directives (hardware inspection job)
            hidden: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM Enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.cluster.resource }}
                tooltip: >-
                  The partition holding the nodes this stack is FOR. Pick the one you
                  will run on; a heterogeneous cluster needs one run per node type.
              time:
                label: Walltime
                type: string
                default: '00:20:00'
                tooltip: >-
                  Inspection takes seconds, but a cloud-burst node can take 6+ minutes
                  to power on, so the default leaves room for that.
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                default: 0
                tooltip: >-
                  Request a GPU here when building the GPU path, so inspection lands on
                  a node that actually has one and can report its compute capability.
              scheduler_directives:
                type: editor
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix:
                  #SBATCH --constraint=<feature>
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS Directives (hardware inspection job)
            hidden: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                optional: true
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix:
                  #PBS -l mem=16gb

      spack_header:
        type: header
        text: Stack Options
        size: 18

      service:
        type: group
        items:
          # Stable identifier prefix used for job and directory naming.
          # Keep stable; do not template from other inputs.
          name:
            type: string
            default: spack-builder
            hidden: true
          spack_version:
            type: string
            label: Spack version (git tag)
            default: v1.2.2
            tooltip: >-
              Must be a v1.x tag. Compilers are dependencies in v1 and the
              environment template relies on that; older tags will not concretize.
          install_prefix:
            type: string
            label: Spack root
            default: ${HOME}/spack
            tooltip: >-
              Must be on a filesystem shared between the login and compute nodes.
              Kept in user space so no step needs sudo.
          buildcache_path:
            type: string
            label: Binary build cache
            default: ${HOME}/spack-buildcache
            tooltip: >-
              Directory-backed Spack mirror. Every package built here is pushed to it,
              and later runs install from it instead of recompiling.
          build_jobs:
            type: number
            label: Parallel build jobs (-j)
            default: 8
            min: 1
            max: 192
          concretize_only:
            type: boolean
            label: Stop after concretizing (dry run)
            default: false
            tooltip: >-
              Bootstrap Spack, set up the build cache, inspect the hardware, render and
              concretize the environment, then stop before the long compile. Use this to
              validate a cluster or a spec change in minutes.
          use_public_buildcache:
            type: boolean
            label: Also use Spack's public binary cache
            default: false
            tooltip: >-
              Experimental. Can skip large builds when hashes match, but fabric-specific
              variants usually prevent that, so it is off by default.
          build_gpu:
            type: boolean
            label: Build the GPU path (CUDA-aware OpenMPI + GROMACS+cuda)
            default: false
            tooltip: >-
              Opt-in. Adds a CUDA-aware OpenMPI and a GROMACS+cuda built against it.
              The CPU MPIs and CPU GROMACS are always built regardless.

          overrides_header:
            type: header
            text: Manual overrides (advanced — all three together or none)
            size: 14
          use_overrides:
            type: boolean
            label: Skip hardware inspection and set the profile manually
            default: false
            tooltip: >-
              When on, you MUST set target, fabric and cuda-arch below; mixing some
              overrides with inspection is rejected. With all three set, no worker node
              is allocated at all.
          override_target:
            type: string
            label: Spack microarch target
            placeholder: x86_64_v4
            hidden: ${{ !inputs.service.use_overrides }}
            tooltip: e.g. x86_64_v3, x86_64_v4, neoverse_v1, zen4, cascadelake.
          override_fabric:
            type: dropdown
            label: Fabric profile
            hidden: ${{ !inputs.service.use_overrides }}
            options:
              - label: AWS EFA (OFI)
                value: aws
              - label: Azure InfiniBand (UCX/verbs)
                value: azure
              - label: GCP (OFI / verbs)
                value: gcp
              - label: Oracle RDMA (UCX/verbs)
                value: oracle
              - label: Generic (TCP/shm, no RDMA)
                value: generic
          override_cuda_arch:
            type: string
            label: CUDA arch (or 'none' for CPU-only)
            placeholder: '90'
            hidden: ${{ !inputs.service.use_overrides }}
            tooltip: >-
              Spack cuda_arch (80=A100, 90=H100, 89=L4/L40). Use 'none' to force a
              CPU-only build even with overrides on.

jobs:
  # -------------------------------------------------------------------------
  # 1. Check out app/, write inputs.sh, bootstrap Spack and the build cache on
  #    the login node, and assemble the two scripts the submitter will run.
  # -------------------------------------------------------------------------
  preprocess:
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    outputs:
      RUNDIR: ${{ needs.preprocess.steps.assemble.outputs.RUNDIR }}
      DETECT_DIR: ${{ needs.preprocess.steps.assemble.outputs.DETECT_DIR }}
      BUILD_DIR: ${{ needs.preprocess.steps.assemble.outputs.BUILD_DIR }}
      ENDPOINT_DIR: ${{ needs.preprocess.steps.assemble.outputs.ENDPOINT_DIR }}
      DETECT_SCRIPT: ${{ needs.preprocess.steps.assemble.outputs.DETECT_SCRIPT }}
      BUILD_SCRIPT: ${{ needs.preprocess.steps.assemble.outputs.BUILD_SCRIPT }}
      ENDPOINT_SCRIPT: ${{ needs.preprocess.steps.assemble.outputs.ENDPOINT_SCRIPT }}
      SKIP_CLEANUP_PATH: ${{ needs.preprocess.steps.assemble.outputs.SKIP_CLEANUP_PATH }}
      NEED_DETECT: ${{ needs.preprocess.steps.assemble.outputs.NEED_DETECT }}
    steps:
      - name: Checkout workflow app
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: add-spack-builder
          sparse_checkout:
            - workflows/spack-builder/app
            - tools/utils

      - name: Create Inputs
        run: |
          set -x
          # Write PW variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          service_name="${{ inputs.service.name }}"
          pw_endpoints_args="--name ${{ inputs.service.name }}-${PW_RUN_SLUG}"
          service_spack_version="${{ inputs.service.spack_version }}"
          service_install_prefix="${{ inputs.service.install_prefix }}"
          service_buildcache_path="${{ inputs.service.buildcache_path }}"
          service_build_jobs="${{ inputs.service.build_jobs }}"
          service_build_gpu="${{ inputs.service.build_gpu }}"
          service_concretize_only="${{ inputs.service.concretize_only }}"
          service_use_public_buildcache="${{ inputs.service.use_public_buildcache }}"
          OVERRIDE_TARGET="${{ inputs.service.use_overrides && inputs.service.override_target || '' }}"
          OVERRIDE_FABRIC="${{ inputs.service.use_overrides && inputs.service.override_fabric || '' }}"
          OVERRIDE_CUDA_ARCH="${{ inputs.service.use_overrides && inputs.service.override_cuda_arch || '' }}"
          EOF
          # Resolved HERE, and deliberately not inside the quoted heredoc above.
          # Each submitted job runs in its OWN directory under this one, so a
          # ${PWD}-relative value would expand differently in every job that
          # sources inputs.sh: detect would write fabric.env into detect/ and the
          # build would look for it in build/, and app_dir would point at a
          # checkout that only exists here. That is exactly how run thorough-oryx
          # failed with "No fabric profile at .../build/fabric.env".
          cat <<EOF >> inputs.sh
          app_dir="${PWD}/workflows/spack-builder/app"
          fabric_env="${PWD}/fabric.env"
          env_dir="${PWD}/spack-env"
          EOF
          # Remove empty variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          # Add export to all lines
          sed -i 's/^/export /' inputs.sh
          cat inputs.sh

      - name: Controller Preprocessing
        run: |
          set -euo pipefail
          set -x
          # The login node is the one with internet: bootstrap Spack, reconcile
          # site externals and register the build cache here, once, before
          # anything is submitted. The inspection job needs this Spack to exist
          # so it can report `spack arch -t`.
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat "workflows/spack-builder/app/controller.sh" >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh

      - name: Assemble scripts
        id: assemble
        run: |
          set -euo pipefail
          set -x
          set -a; . ./inputs.sh; set +a

          # All-or-nothing override policy. When it returns NEED_DETECT=0 the
          # fabric profile is already written and no worker is allocated.
          bash "workflows/spack-builder/app/resolve-profile.sh" \
               "${PWD}/profile.decision" "${PWD}/fabric.env"
          . "${PWD}/profile.decision"
          echo "NEED_DETECT=${NEED_DETECT}" | tee -a $OUTPUTS
          echo "RUNDIR=${PWD}" | tee -a $OUTPUTS

          # One run directory per submitted job. They must NOT share one:
          # script_submitter streams its script's output to run.${PW_JOB_ID}.out
          # in its rundir, and all three submissions of a run carry the same
          # PW_JOB_ID -- so a shared directory means the endpoint job truncates
          # the build log that explains the build. (Observed on aws run
          # charming-mongoose: the whole install was gone from the node, and the
          # only surviving copy was the platform-side log.) The scripts
          # themselves are unaffected: every path they use -- inputs.sh,
          # fabric.env, spack-env, app/ -- is absolute and still points here.
          mkdir -p "${PWD}/detect" "${PWD}/build" "${PWD}/endpoint"
          echo "DETECT_DIR=${PWD}/detect" | tee -a $OUTPUTS
          echo "BUILD_DIR=${PWD}/build" | tee -a $OUTPUTS
          echo "ENDPOINT_DIR=${PWD}/endpoint" | tee -a $OUTPUTS

          # script_submitter runs an existing script, so each one is inputs.sh
          # concatenated with its body. Note this puts the script in the run
          # directory, not in app/ -- which is why the scripts take their paths
          # from inputs.sh rather than from $BASH_SOURCE.
          cp inputs.sh detect-${PW_JOB_ID}.sh
          cat "workflows/spack-builder/app/detect-fabric.sh" >> detect-${PW_JOB_ID}.sh
          echo "DETECT_SCRIPT=${PWD}/detect-${PW_JOB_ID}.sh" | tee -a $OUTPUTS

          cp inputs.sh build-${PW_JOB_ID}.sh
          cat "workflows/spack-builder/app/build.sh" >> build-${PW_JOB_ID}.sh
          echo "BUILD_SCRIPT=${PWD}/build-${PW_JOB_ID}.sh" | tee -a $OUTPUTS

          # The placeholder endpoint. The trap wrapper is the one every service
          # workflow here uses: it runs cancel.sh once and then kills the process
          # group, which is what makes `pw endpoints delete` on teardown reliable.
          cp inputs.sh endpoint-${PW_JOB_ID}.sh
          cat <<'EOF' >> endpoint-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE
          EOF
          cat "workflows/spack-builder/app/start-template.sh" >> endpoint-${PW_JOB_ID}.sh
          echo "ENDPOINT_SCRIPT=${PWD}/endpoint-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  # -------------------------------------------------------------------------
  # 2. Inspect the compute hardware. Skipped entirely when complete overrides
  #    were supplied, so no worker is allocated in that case.
  # -------------------------------------------------------------------------
  detect:
    needs:
      - preprocess
    if: ${{ needs.preprocess.outputs.NEED_DETECT == '1' }}
    steps:
      - name: Inspect compute node
        uses: github/parallelworks/workflows@add-spack-builder
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          rundir: ${{ needs.preprocess.outputs.DETECT_DIR }}
          use_existing_script: true
          script_path: ${{ needs.preprocess.outputs.DETECT_SCRIPT }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ''
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}

  # -------------------------------------------------------------------------
  # 3. Build on the LOGIN node: scheduler=false sends this down
  #    script_submitter's ssh_job path, so there is no queue walltime bounding a
  #    multi-hour compile and source fetches have internet. Output still streams
  #    to run.<JOBID>.out for platform log visibility.
  # -------------------------------------------------------------------------
  build:
    needs:
      - preprocess
      - detect
    steps:
      - name: Build the stack
        uses: github/parallelworks/workflows@add-spack-builder
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          rundir: ${{ needs.preprocess.outputs.BUILD_DIR }}
          use_existing_script: true
          script_path: ${{ needs.preprocess.outputs.BUILD_SCRIPT }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: false
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ''
          slurm:
            is_enabled: false
          pbs:
            is_enabled: false

  # -------------------------------------------------------------------------
  # 4. Turn a failed build into a failed RUN.
  #    script_submitter's unscheduled path detaches the script with setsid and
  #    then polls `kill -0`, so it observes that the process ended but never its
  #    exit status. Without this job a build that dies half way -- as the first
  #    gce2 run did, on ucx -- is still reported as completed, and a user would
  #    believe a stack exists that does not.
  # -------------------------------------------------------------------------
  verify:
    needs:
      - preprocess
      - build
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Confirm the build succeeded
        run: |
          set -uo pipefail
          STATUS_FILE="${{ needs.preprocess.outputs.BUILD_DIR }}/BUILD_STATUS"
          st="$(cat "${STATUS_FILE}" 2>/dev/null || echo missing)"
          echo "build.sh exit status: ${st}"
          if [ "${st}" != "0" ]; then
            echo "::error title=Error::Build failed (status '${st}'). See run.*.out in ${{ needs.preprocess.outputs.BUILD_DIR }}"
            exit 1
          fi
          echo "::notice::Build completed successfully"

  # -------------------------------------------------------------------------
  # 5. Serve a placeholder endpoint.
  #    Nothing in the build needs this. The shared test runner
  #    (tools/tests/run-workflow-test.py) passes a run only when an endpoint
  #    named <service.name>-<run-slug> is listed and answers HTTP, so a workflow
  #    that serves nothing cannot be tested by it. Serving an empty page is the
  #    smaller change -- see README.md, "The placeholder endpoint".
  #
  #    It runs in its own directory under the run dir, like every other
  #    submitted job here, so its ./cancel.sh and its run.<JOBID>.out cannot
  #    collide with the build's.
  # -------------------------------------------------------------------------
  endpoint:
    needs:
      - preprocess
      - verify
    steps:
      - name: Serve the placeholder endpoint
        uses: github/parallelworks/workflows@add-spack-builder
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          rundir: ${{ needs.preprocess.outputs.ENDPOINT_DIR }}
          use_existing_script: true
          script_path: ${{ needs.preprocess.outputs.ENDPOINT_SCRIPT }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: false
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocess.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: false
          pbs:
            is_enabled: false
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::The placeholder endpoint never came online"
          exit 1

  # -------------------------------------------------------------------------
  # 6. Release the run once the endpoint answers, and leave it serving.
  #    Touching SKIP_CLEANUP tells script_submitter not to run cancel.sh when
  #    the job is cancelled, so the endpoint outlives the run -- which is what
  #    the test runner checks before deleting it itself.
  # -------------------------------------------------------------------------
  wait_for_endpoint:
    needs:
      - preprocess
      - verify
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          endpoint_name="${{ inputs.service.name }}-${PW_RUN_SLUG}"
          echo "::notice::Waiting for endpoint ${endpoint_name} to come online"
          until pw endpoints list | grep -qw "${endpoint_name}"; do
            echo "$(date) Endpoint ${endpoint_name} not found yet; retrying in 10 seconds"
            sleep 10
          done
          echo "::notice::Endpoint ${endpoint_name} is online"
          touch ${{ needs.preprocess.outputs.SKIP_CLEANUP_PATH }}
          sleep 2
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - endpoint
