jobs:
  install:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout Fractal Demo
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - tutorials/demo-app
      - name: Install Dependencies
        run: |
          # keep only the example directory from the sparse checkout
          mv tutorials/demo-app .
          rm -r workflow
          ./demo-app/install.sh

  run:
    needs:
      - install
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Render and Serve
        run: RESOLUTION=${{ inputs.resolution }} PORT=${{ inputs.port }} ./demo-app/run.sh

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource target
        tooltip: The compute cluster to run the fractal example on.
        autoselect: true
        optional: false
      resolution:
        type: number
        label: Resolution
        description: Image size in pixels; larger looks sharper and takes longer to render.
        default: 2500
        min: 100
        max: 10000
        step: 1
      port:
        type: number
        label: Port
        tooltip: Port the progress web server listens on.
        default: 8000
        min: 1024
        max: 65535
        step: 1
