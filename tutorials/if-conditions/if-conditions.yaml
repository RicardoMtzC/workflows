# if-conditions.yaml - what the `if:` status functions do, on steps and on jobs.
#
# Pick an Outcome in the form (succeed / fail / cancel), run the workflow, and
# compare which steps and jobs ran with which were skipped.
#
#   condition      on a STEP: looks at its own job so far      on a JOB: looks at the jobs in `needs`
#   ------------   -----------------------------------------   ---------------------------------------
#   always()       runs                                        runs
#   false          skipped                                     skipped
#   success()      no earlier step failed, job not canceled    no needed job failed or was canceled
#   failure()      an earlier step failed                      a needed job failed
#   cancelled()    this job was canceled                       a needed job was canceled
#   !success()     a step failed or the job was canceled       a needed job failed or was canceled
#   !failure()     no earlier step failed                      no needed job failed
#   !cancelled()   this job was not canceled                   no needed job was canceled
#
# Leaving `if:` out behaves like `if: ${{ success() }}`, and so does an `if:`
# that calls no status function: `${{ inputs.debug == true }}` runs only when
# nothing failed. Calling one replaces that check. `canceled()` is another
# spelling of `cancelled()`. A bare word is text, which is true, so
# `${{ error }}` is the string "error", not a status check. The exception is
# `always`, the older spelling of `always()`: still accepted as the whole
# condition, but text inside a larger one. Write `always()`.
# The functions combine with inputs, outputs and operators (&&, ||, !,
# ternary): see the `fallback` job.

# parallelworks/cancel-jobs needs the grant.
permissions:
  - '*'

jobs:
  # ---- Part 1: `if:` on STEPS. Each function looks at what already happened in this job.
  work:
    steps:
      - name: Do the work
        run: |
          case "${{ inputs.outcome }}" in
            succeed) echo "The work finished." ;;
            fail)    echo "The work hit an error."; exit 1 ;;
            cancel)  echo "The next step cancels this job." ;;
          esac

      - name: Cancel this job (only when Outcome is cancel)
        if: ${{ inputs.outcome == 'cancel' }}
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - work

      - name: "if: success() (same as no if)"
        if: ${{ success() }}
        run: echo "ran because no earlier step failed and the job was not canceled"

      - name: "if: failure()"
        if: ${{ failure() }}
        run: echo "ran because an earlier step failed"

      - name: "if: cancelled()"
        if: ${{ cancelled() }}
        run: echo "ran because this job was canceled"

      - name: "if: !success()"
        if: ${{ !success() }}
        run: echo "ran because a step failed OR the job was canceled"

      - name: "if: always()"
        if: ${{ always() }}
        run: echo "ran no matter what happened above"

      - name: "if: false"
        if: ${{ false }}
        run: echo "you will never see this line"

  # ---- Part 2: `if:` on JOBS. Each function looks at the jobs listed in `needs`.
  on-success:
    needs:
      - work
    if: ${{ success() }}
    steps:
      - run: echo "ran because work succeeded (same as leaving if out)"

  on-failure:
    needs:
      - work
    if: ${{ failure() }}
    steps:
      - run: echo "ran because work failed"

  on-cancelled:
    needs:
      - work
    if: ${{ cancelled() }}
    steps:
      - run: echo "ran because work was canceled"

  on-not-success:
    needs:
      - work
    if: ${{ !success() }}
    steps:
      - run: echo "ran because work failed OR was canceled, so this is a good place for an alert"

  fallback:
    needs:
      - work
    # Status functions are booleans, so they combine with inputs:
    # "if the box is ticked, run when work failed; otherwise never run".
    # `"${{ inputs.fallback ? failure() : false }}"` would mean the same thing;
    # a ternary needs the quotes, because YAML would otherwise read its " : "
    # as a mapping.
    if: ${{ inputs.fallback && failure() }}
    steps:
      - run: echo "ran because work failed and the fallback box was ticked"

  report:
    needs:
      - work
    if: ${{ always() }}
    steps:
      - run: echo "ran no matter how work ended, so this is a good place for teardown or a summary"

'on':
  execute:
    inputs:
      outcome:
        type: dropdown
        label: How should the work job end?
        default: succeed
        tooltip: Run once with each choice and compare which steps and jobs ran.
        options:
          - label: succeed
            value: succeed
          - label: fail (its first step exits 1)
            value: fail
          - label: cancel (it cancels itself)
            value: cancel
      fallback:
        type: boolean
        label: Run the fallback job when work fails?
        default: true
